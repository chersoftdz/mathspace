<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صياد الكسور: طاقة الفضاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
        }

        /* تنسيق الكسر الرياضي بشكل عمودي جميل */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            line-height: 1;
        }

        .fraction .numerator {
            border-bottom: 3px solid currentColor;
            padding-bottom: 2px;
            width: 100%;
            text-align: center;
        }

        .fraction .denominator {
            padding-top: 2px;
            width: 100%;
            text-align: center;
        }

        /* تأثير النصوص العائمة (للنقاط والخطأ) */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.5rem;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 50;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }

        /* تنسيق فقاعات الكسور */
        .orb {
            position: absolute;
            border-radius: 50%;
            cursor: crosshair;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .orb:hover {
            transform: scale(1.1);
        }

        .orb:active {
            transform: scale(0.95);
        }

        /* لمعان الفقاعة (الإضاءة الداخلية) */
        .orb-glare {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 25%;
            height: 25%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(1px);
        }

        /* علامة التصويب التي تظهر عند تمرير الماوس فوق الفقاعة */
        .target-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(1px);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb:hover .target-overlay {
            opacity: 1;
        }
    </style>
</head>

    <script>
        // --- إعدادات اللعبة ---
        const LEVELS = {
            1: { targets: [{ n: 1, d: 2 }, { n: 1, d: 3 }, { n: 1, d: 4 }], maxSpeed: 0.15, spawnRate: 3500 },
            2: { targets: [{ n: 2, d: 3 }, { n: 3, d: 4 }, { n: 2, d: 5 }, { n: 1, d: 5 }], maxSpeed: 0.2, spawnRate: 3000 },
            3: { targets: [{ n: 4, d: 6 }, { n: 6, d: 8 }, { n: 10, d: 15 }], maxSpeed: 0.3, spawnRate: 2500 }
        };

        // --- المتغيرات العامة ---
        let gameState = 'START';
        let isPaused = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let streak = 0;
        let highScore = parseInt(localStorage.getItem('fractionHunterHighScore')) || 0;

        let targetFraction = null;
        let orbs = [];

        let lastTime = 0;
        let timeSinceLastSpawn = 0;
        let animationId = null;

        // --- عناصر DOM ---
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            pause: document.getElementById('pause-screen'),
            gameOver: document.getElementById('game-over-screen')
        };
        const playArea = document.getElementById('play-area');
        const scoreVal = document.getElementById('score-val');
        const levelVal = document.getElementById('level-val');
        const livesContainer = document.getElementById('lives-container');
        const targetFractionEl = document.getElementById('target-fraction');
        const streakContainer = document.getElementById('streak-container');
        const streakVal = document.getElementById('streak-val');

        // إظهار أعلى نتيجة إذا كانت موجودة في التخزين المحلي
        if (highScore > 0) {
            document.getElementById('high-score-display').classList.remove('hidden');
            document.getElementById('high-score-display').classList.add('flex');
            document.getElementById('high-score-val').textContent = `أعلى طاقة مجمعة: ${highScore}`;
        }

        // --- الدوال المساعدة ---

        // حساب القاسم المشترك الأكبر للتبسيط
        function getGCD(a, b) {
            return b === 0 ? a : getGCD(b, a % b);
        }

        // التبديل بين شاشات اللعبة
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            if (screens[screenName]) screens[screenName].classList.remove('hidden');
        }

        // تحاكي زر الخروج للمنصة
        function closeGame() {
            console.log("سيتم إغلاق اللعبة والعودة للمنصة");
            try {
                if (window.parent && window.parent.document.getElementById('endGameBtn')) {
                    window.parent.document.getElementById('endGameBtn').click();
                }
            } catch (e) { console.error("Error closing iframe", e); }
        }

        // --- دوال التحكم باللعبة ---

        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            streak = 0;
            orbs = [];
            playArea.innerHTML = '';

            pickNewTarget(1);
            updateHUD();
            switchScreen('game');

            gameState = 'PLAYING';
            isPaused = false;
            lastTime = performance.now();
            timeSinceLastSpawn = 0;

            // جعل أول فقاعة تظهر فوراً داخل الشاشة (عند 95%) لكسر الملل
            spawnOrb(95);

            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function pauseGame() {
            if (gameState === 'PLAYING' && !isPaused) {
                isPaused = true;
                screens.pause.classList.remove('hidden');
            }
        }

        function resumeGame() {
            if (gameState === 'PLAYING' && isPaused) {
                isPaused = false;
                screens.pause.classList.add('hidden');
                lastTime = performance.now();
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function quitGame() {
            gameState = 'START';
            isPaused = false;
            screens.pause.classList.add('hidden');
            switchScreen('start');
            if (animationId) cancelAnimationFrame(animationId);
        }

        function gameOver() {
            gameState = 'GAME_OVER';
            switchScreen('gameOver');
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-high-score').textContent = Math.max(score, highScore);
        }

        function pickNewTarget(lvl) {
            const targets = LEVELS[lvl].targets;
            targetFraction = targets[Math.floor(Math.random() * targets.length)];
            targetFractionEl.innerHTML = `
                <span class="numerator">${targetFraction.n}</span>
                <span class="denominator">${targetFraction.d}</span>
            `;
        }

        function spawnOrb(startY = 110) {
            if (!targetFraction) return;

            const isEquivalent = Math.random() < 0.4; // 40% فرصة للكسر الصحيح
            let newN, newD;

            if (isEquivalent) {
                const multiplier = Math.floor(Math.random() * 4) + 2;
                const gcd = getGCD(targetFraction.n, targetFraction.d);
                const simplifiedN = targetFraction.n / gcd;
                const simplifiedD = targetFraction.d / gcd;
                newN = simplifiedN * multiplier;
                newD = simplifiedD * multiplier;
            } else {
                do {
                    newN = Math.floor(Math.random() * 10) + 1;
                    newD = Math.floor(Math.random() * 10) + 2;
                } while (newN / newD === targetFraction.n / targetFraction.d);
            }

            const size = Math.floor(Math.random() * 20) + 70; // الحجم بين 70 و 90
            const color = `hsl(${Math.random() * 360}, 80%, 60%)`;
            const x = Math.floor(Math.random() * 80) + 10; // الوضع الأفقي
            const speed = Math.random() * LEVELS[level].maxSpeed + 0.05;

            const orbId = 'orb-' + Date.now() + Math.random();

            // إنشاء زر الفقاعة
            const btn = document.createElement('button');
            btn.className = 'orb group pointer-events-auto';
            btn.id = orbId;
            btn.style.left = `${x}%`;
            btn.style.top = `${startY}%`;
            btn.style.width = `${size}px`;
            btn.style.height = `${size}px`;
            btn.style.background = `radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent), radial-gradient(circle at center, ${color}40, ${color}80)`;
            btn.style.boxShadow = `0 0 15px ${color}60, inset 0 0 20px ${color}80`;
            btn.style.border = `1px solid ${color}AA`;

            // المحتوى الداخلي للفقاعة
            const fontSizeClass = size < 75 ? 'text-lg' : (size > 85 ? 'text-2xl' : 'text-xl');
            btn.innerHTML = `
                <div class="orb-glare"></div>
                <div class="relative z-10 text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] fraction ${fontSizeClass}">
                    <span class="numerator">${newN}</span>
                    <span class="denominator">${newD}</span>
                </div>
                <div class="target-overlay">
                    <svg width="${size * 0.6}" height="${size * 0.6}" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin-slow"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                </div>
            `;

            const orbData = { id: orbId, element: btn, x, y: startY, speed, n: newN, d: newD, isEquivalent };

            btn.onclick = () => handleOrbClick(orbData);
            playArea.appendChild(btn);
            orbs.push(orbData);
        }

        function handleOrbClick(orb) {
            if (isPaused || gameState !== 'PLAYING') return;

            // إخفاء الفقاعة
            orb.element.remove();
            orbs = orbs.filter(o => o.id !== orb.id);

            const gcd = getGCD(orb.n, orb.d);
            const simpN = orb.n / gcd;
            const simpD = orb.d / gcd;

            let feedbackText = '';
            let feedbackColor = '';

            if (orb.isEquivalent) {
                // إجابة صحيحة
                const newStreak = streak + 1;
                streak = newStreak;
                const multiplier = newStreak > 5 ? 3 : (newStreak > 2 ? 2 : 1);

                score += (10 * multiplier);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('fractionHunterHighScore', highScore);
                }

                feedbackText = `+${10 * multiplier}`;
                feedbackColor = 'text-green-400';

                // الترقية للمستوى التالي
                let newLevel = level;
                if (score >= 150) newLevel = 3;
                else if (score >= 50) newLevel = 2;

                if (newLevel !== level) {
                    level = newLevel;
                    pickNewTarget(level);
                    // مسح الشاشة
                    orbs.forEach(o => o.element.remove());
                    orbs = [];
                    // إظهار فقاعة جديدة فوراً عند الترقية
                    spawnOrb(95);
                    timeSinceLastSpawn = 0;
                }
            } else {
                // إجابة خاطئة
                streak = 0;
                lives--;
                feedbackText = `خطأ! تساوي ${simpN}/${simpD}`;
                feedbackColor = 'text-red-400';

                if (lives <= 0) {
                    gameOver();
                }
            }

            updateHUD();
            showFeedback(feedbackText, orb.x, orb.y, feedbackColor);
        }

        // إظهار نص عائم يطير ويختفي
        function showFeedback(text, x, y, colorClass) {
            const el = document.createElement('div');
            el.className = `floating-text ${colorClass}`;
            el.style.left = `${x}%`;
            el.style.top = `${y}%`;
            el.textContent = text;
            playArea.appendChild(el);
            setTimeout(() => el.remove(), 1500); // يختفي بعد ثانية ونصف
        }

        function updateHUD() {
            scoreVal.textContent = score;
            levelVal.textContent = `مستوى ${level}`;

            // الكومبو
            if (streak > 2) {
                streakContainer.classList.remove('hidden');
                streakContainer.classList.add('flex');
                streakVal.textContent = `x${streak > 5 ? 3 : 2}`;
            } else {
                streakContainer.classList.add('hidden');
                streakContainer.classList.remove('flex');
            }

            // رسم القلوب
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="transition-all duration-300 ${i < lives ? 'text-red-500 fill-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.8)]' : 'text-indigo-900 fill-none'}"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
                livesContainer.appendChild(heart);
            }
        }

        // --- حلقة اللعبة الأساسية (Game Loop) ---
        function gameLoop(currentTime) {
            if (gameState !== 'PLAYING' || isPaused) return;

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // تحريك الفقاعات الحالية
            for (let i = orbs.length - 1; i >= 0; i--) {
                const orb = orbs[i];
                orb.y -= orb.speed;
                orb.element.style.top = `${orb.y}%`;

                // إذا خرجت الفقاعة من أعلى الشاشة نحذفها
                if (orb.y < -20) {
                    orb.element.remove();
                    orbs.splice(i, 1);
                }
            }

            // توليد فقاعات جديدة بناءً على معدل التوليد الخاص بالمستوى
            timeSinceLastSpawn += deltaTime;
            if (timeSinceLastSpawn > LEVELS[level].spawnRate) {
                if (orbs.length < 7) { // بحد أقصى 7 فقاعات في الشاشة
                    spawnOrb(110); // الفقاعات الجديدة تظهر من أسفل الشاشة
                }
                timeSinceLastSpawn = 0;
            }

            animationId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
