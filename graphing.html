<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسم البياني - منصة الرياضيات التفاعلية</title>
    <link rel="stylesheet" href="styles.css">
    <link href="assets/css/cairo.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <!-- Fallback if local assets missing -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.05);
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --accent: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .graph-app-container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 70px);
            max-height: calc(100vh - 70px);
        }

        /* Header */
        .graph-header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: var(--glass-border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            height: 70px;
            box-sizing: border-box;
        }

        .graph-header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .graph-header h1 i {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .graph-header .home-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: var(--glass-border);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .graph-header .home-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        /* Sidebar */
        .graph-sidebar {
            width: 350px;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 90;
        }

        .sidebar-content {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        /* Scrollbar */
        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .function-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: var(--glass-border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .function-card::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 4px;
        }

        .function-card.f1::before {
            background: #ef4444;
        }

        .function-card.f2::before {
            background: #3b82f6;
        }

        .function-card.f3::before {
            background: #10b981;
        }

        .function-card:focus-within {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-indicator {
            width: 22px;
            height: 22px;
            border-radius: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .func-input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            direction: ltr;
            color: white;
        }

        .func-input:focus {
            outline: none;
        }

        .visibility-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .visibility-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .visibility-btn.active {
            color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Canvas Area */
        .graph-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            flex-direction: row-reverse;
        }

        .graph-canvas-area {
            flex: 1;
            position: relative;
            background: #ffffff;
            /* Keep it white for math clarity */
            border-radius: 20px;
            margin: 15px;
            margin-left: 0;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1), 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            cursor: crosshair;
        }

        #graphCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Canvas Overlay Controls */
        .canvas-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 80;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            color: #1e293b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .control-btn:hover {
            transform: translateX(2px);
            background: var(--primary);
            color: white;
            border-color: transparent;
        }

        .keypad-toggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border-radius: 16px;
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            z-index: 95;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .keypad-toggle:hover {
            transform: scale(1.05);
            background: var(--secondary);
        }

        /* Virtual Keypad */
        .virtual-keypad {
            position: absolute;
            bottom: 20px;
            right: 90px;
            /* Next to toggle */
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--glass-border);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .virtual-keypad.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .keypad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .keys-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .key-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.15s;
        }

        .key-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .key-btn:active {
            transform: scale(0.92);
        }

        .key-btn.op {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .key-btn.var {
            color: #ef4444;
            font-style: italic;
            background: rgba(239, 68, 68, 0.1);
        }

        .key-btn.action {
            color: #fca5a5;
        }

        @media (max-width: 768px) {
            .graph-app-container {
                flex-direction: column;
                height: auto;
            }

            .graph-workspace {
                flex-direction: column-reverse;
                height: calc(100vh - 70px);
            }

            .graph-sidebar {
                width: 100%;
                border-left: none;
                border-bottom: var(--glass-border);
                flex-shrink: 0;
            }

            .graph-canvas-area {
                margin: 10px;
                height: 50vh;
                flex: none;
            }

            .virtual-keypad {
                right: 10px;
                left: 10px;
                bottom: 85px;
            }

            .keys-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="graph-header">
        <h1>
            <i class="fas fa-chart-line"></i>
            <span>الرسم البياني</span>
        </h1>
        <button onclick="window.location.href='./'" class="home-btn">
            <i class="fas fa-home"></i> خروج
        </button>
    </header>

    <div class="graph-app-container">

        <!-- Main Workspace -->
        <div class="graph-workspace">

            <!-- Sidebar: Functions -->
            <div class="graph-sidebar">
                <div class="sidebar-content">
                    <h3 style="margin-top: 0; color: #4a5568;">الدوال</h3>

                    <!-- Function 1 -->
                    <div class="function-card f1">
                        <div class="input-group">
                            <div class="color-indicator" style="background: #e74c3c;"></div>
                            <span style="font-family: 'Courier New';">f(x)=</span>
                            <input type="text" class="func-input" id="func1" value="x^2" data-color="#e74c3c"
                                onfocus="setActiveInput('func1')">
                            <button class="visibility-btn active" onclick="toggleVisibility(1, this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Function 2 -->
                    <div class="function-card f2">
                        <div class="input-group">
                            <div class="color-indicator" style="background: #3498db;"></div>
                            <span style="font-family: 'Courier New';">g(x)=</span>
                            <input type="text" class="func-input" id="func2" placeholder="" data-color="#3498db"
                                onfocus="setActiveInput('func2')">
                            <button class="visibility-btn active" onclick="toggleVisibility(2, this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Function 3 -->
                    <div class="function-card f3">
                        <div class="input-group">
                            <div class="color-indicator" style="background: #2ecc71;"></div>
                            <span style="font-family: 'Courier New';">h(x)=</span>
                            <input type="text" class="func-input" id="func3" placeholder="" data-color="#2ecc71"
                                onfocus="setActiveInput('func3')">
                            <button class="visibility-btn active" onclick="toggleVisibility(3, this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <button onclick="plotAll()" class="btn btn-primary"
                            style="width: 100%; background: var(--primary-gradient); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">
                            <i class="fas fa-sync-alt"></i> تحديث الرسم
                        </button>
                    </div>

                    <h4 style="margin-top: 20px; color: #718096;">الإعدادات</h4>
                    <div class="input-group" style="justify-content: space-between;">
                        <label>الشبكة:</label>
                        <select id="gridType" onchange="updateSettings()" style="padding: 5px; border-radius: 5px;">
                            <option value="unified">مربعة (موحدة)</option>
                            <option value="separate">مستطيلة</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="graph-canvas-area">
                <canvas id="graphCanvas"></canvas>

                <!-- On-Canvas Controls -->
                <div class="canvas-controls">
                    <button class="control-btn" onclick="resetView()" title="إعادة تعيين">
                        <i class="fas fa-compress-arrows-alt"></i>
                    </button>
                    <button class="control-btn" onclick="zoomIn()" title="تكبير">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="control-btn" onclick="zoomOut()" title="تصغير">
                        <i class="fas fa-minus"></i>
                    </button>
                </div>

                <!-- Floating Keypad Toggle -->
                <button class="keypad-toggle" onclick="toggleKeypad()">
                    <i class="fas fa-keyboard"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- Virtual Keypad -->
    <div class="virtual-keypad" id="virtualKeypad">
        <div class="keypad-header">
            <span style="color: #4a5568; font-weight: bold;">لوحة المفاتيح الرياضية</span>
            <button onclick="toggleKeypad()"
                style="background:none; border:none; font-size: 1.2rem; cursor: pointer; color: #e74c3c;">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
        <div class="keys-grid">
            <!-- Row 1 -->
            <button class="key-btn var" onclick="insertKey('x')">x</button>
            <button class="key-btn var" onclick="insertKey('y')">y</button>
            <button class="key-btn op" onclick="insertKey('^')">^</button>
            <button class="key-btn op" onclick="insertKey('(')">(</button>
            <button class="key-btn op" onclick="insertKey(')')">)</button>
            <button class="key-btn action" onclick="backspace()"><i class="fas fa-backspace"></i></button>

            <!-- Row 2 -->
            <button class="key-btn num" onclick="insertKey('7')">7</button>
            <button class="key-btn num" onclick="insertKey('8')">8</button>
            <button class="key-btn num" onclick="insertKey('9')">9</button>
            <button class="key-btn op" onclick="insertKey('/')">÷</button>
            <button class="key-btn op" onclick="insertKey('sqrt(')">√</button>
            <button class="key-btn op" onclick="insertKey('sin(')">sin</button>

            <!-- Row 3 -->
            <button class="key-btn num" onclick="insertKey('4')">4</button>
            <button class="key-btn num" onclick="insertKey('5')">5</button>
            <button class="key-btn num" onclick="insertKey('6')">6</button>
            <button class="key-btn op" onclick="insertKey('*')">×</button>
            <button class="key-btn op" onclick="insertKey('pi')">π</button>
            <button class="key-btn op" onclick="insertKey('cos(')">cos</button>

            <!-- Row 4 -->
            <button class="key-btn num" onclick="insertKey('1')">1</button>
            <button class="key-btn num" onclick="insertKey('2')">2</button>
            <button class="key-btn num" onclick="insertKey('3')">3</button>
            <button class="key-btn op" onclick="insertKey('-')">-</button>
            <button class="key-btn op" onclick="insertKey('e')">e</button>
            <button class="key-btn op" onclick="insertKey('tan(')">tan</button>

            <!-- Row 5 -->
            <button class="key-btn num" onclick="insertKey('0')">0</button>
            <button class="key-btn num" onclick="insertKey('.')">.</button>
            <button class="key-btn op" onclick="insertKey('=')">=</button>
            <button class="key-btn op" onclick="insertKey('+')">+</button>
            <button class="key-btn op" onclick="insertKey('log(')">log</button>
            <button class="key-btn op" onclick="insertKey('ln(')">ln</button>
        </div>
    </div>

    <script src="graphing.js"></script>
</body>

</html>
