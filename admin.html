<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة فضاء الرياضيات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc, deleteDoc, addDoc, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // إعدادات Firebase الخاصة بالمشروع
        const firebaseConfig = {
            apiKey: "AIzaSyB_4sqWF0WVCojlC9TJajkaLIDLKDUjDsg",
            authDomain: "mathspace2026-d314c.firebaseapp.com",
            projectId: "mathspace2026-d314c",
            storageBucket: "mathspace2026-d314c.firebasestorage.app",
            messagingSenderId: "151688129928",
            appId: "1:151688129928:web:cccef753f6c309bbc6de3d",
            measurementId: "G-ND226S3281"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.addDoc = addDoc;
        window.orderBy = orderBy;
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AdminDashboard = () => {
            const [pendingUsers, setPendingUsers] = useState([]);
            const [admins, setAdmins] = useState([]);
            const [missingTerms, setMissingTerms] = useState([]);
            const [activeTab, setActiveTab] = useState('requests');
            const [newAdminEmail, setNewAdminEmail] = useState('');
            const [adminActionLoading, setAdminActionLoading] = useState(false);

            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [actionLoading, setActionLoading] = useState(null);

            const fetchPending = async () => {
                setLoading(true);
                try {
                    const q = window.query(window.collection(window.db, 'users'), window.where('pendingVerification', '==', true));
                    const snap = await window.getDocs(q);
                    const users = [];
                    snap.forEach(d => users.push({ id: d.id, ...d.data() }));
                    setPendingUsers(users);
                } catch (err) {
                    setError('حدث خطأ أثناء جلب البيانات.');
                    console.error(err);
                }
                setLoading(false);
            };

            const fetchAdmins = async () => {
                setLoading(true); setError('');
                try {
                    const q = window.query(window.collection(window.db, 'users'), window.where('role', '==', 'teacher'), window.where('isAdmin', '==', true));
                    const snap = await window.getDocs(q);
                    const usersList = [];
                    snap.forEach(d => usersList.push({ id: d.id, ...d.data() }));
                    setAdmins(usersList);
                } catch (err) {
                    setError('حدث خطأ أثناء جلب قائمة المديرين.');
                }
                setLoading(false);
            };

            const fetchMissingTerms = async () => {
                setLoading(true); setError('');
                try {
                    const q = window.query(window.collection(window.db, 'missing_terms'));
                    const snap = await window.getDocs(q);
                    const termsList = [];
                    snap.forEach(d => termsList.push({ id: d.id, ...d.data() }));
                    // Sort locally
                    termsList.sort((a, b) => b.timestamp - a.timestamp);
                    setMissingTerms(termsList);
                } catch (err) {
                    setError('حدث خطأ أثناء جلب المصطلحات المفقودة.');
                }
                setLoading(false);
            };

            const handleDeleteTerm = async (termId) => {
                if (!confirm('هل أنت متأكد من حذف هذا المصطلح؟ قم بذلك بعد إضافته للقاموس أو إذا كان غير مناسب.')) return;
                setActionLoading(termId);
                try {
                    await window.deleteDoc(window.doc(window.db, 'missing_terms', termId));
                    setMissingTerms(prev => prev.filter(t => t.id !== termId));
                } catch (err) {
                    alert('خطأ أثناء الحذف.');
                }
                setActionLoading(null);
            };

            useEffect(() => {
                if (activeTab === 'requests') {
                    setTimeout(fetchPending, 1000);
                } else if (activeTab === 'admins') {
                    setTimeout(fetchAdmins, 1000);
                } else if (activeTab === 'dict') {
                    setTimeout(fetchMissingTerms, 1000);
                }
            }, [activeTab]);

            const handleMakeAdmin = async (e) => {
                e.preventDefault();
                if (!newAdminEmail.trim()) return;
                setAdminActionLoading(true); setError('');
                try {
                    const q = window.query(window.collection(window.db, 'users'), window.where('email', '==', newAdminEmail.trim().toLowerCase()));
                    const snap = await window.getDocs(q);
                    if (snap.empty) {
                        setError('لم يتم العثور على مستخدم بهذا البريد الإلكتروني.');
                    } else {
                        const userDoc = snap.docs[0];
                        if (userDoc.data().role !== 'teacher') {
                            setError('هذا البريد يعود لتلميذ، يرجى إدخال حساب أستاذ.');
                        } else {
                            const newInviteCode = userDoc.data().inviteCode || generateInviteCode();
                            await window.updateDoc(window.doc(window.db, 'users', userDoc.id), { isAdmin: true, isVerified: true, inviteCode: newInviteCode });
                            setNewAdminEmail('');
                            fetchAdmins();
                            alert('تمت إضافة المدير بنجاح!');
                        }
                    }
                } catch (err) {
                    setError('خطأ أثناء ترقية المدير.');
                }
                setAdminActionLoading(false);
            };

            const handleRevokeAdmin = async (userId) => {
                if (!confirm('هل أنت متأكد من سحب صلاحية الإدارة؟')) return;
                setActionLoading(userId);
                try {
                    await window.updateDoc(window.doc(window.db, 'users', userId), { isAdmin: false });
                    setAdmins(prev => prev.filter(a => a.id !== userId));
                } catch (err) {
                    alert('خطأ أثناء سحب الصلاحية.');
                }
                setActionLoading(null);
            };

            const generateInviteCode = () => {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = 'TEA-';
                for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
                return code;
            };

            const handleRequest = async (userId, approve) => {
                setActionLoading(userId);
                try {
                    const updates = { pendingVerification: false };
                    if (approve) {
                        updates.isVerified = true;
                        updates.inviteCode = generateInviteCode();
                    } else {
                        updates.verificationProof = null;
                        updates.isVerified = false;
                    }
                    await window.updateDoc(window.doc(window.db, 'users', userId), updates);
                    setPendingUsers(prev => prev.filter(u => u.id !== userId));
                } catch (err) {
                    alert('خطأ أثناء تحديث بيانات المستخدم.');
                }
                setActionLoading(null);
            };

            return (
                <div className="max-w-6xl mx-auto p-6">
                    <header className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-8 border border-slate-200">
                        <div>
                            <h1 className="text-3xl font-black text-slate-800">لوحة الإدارة 🛡️</h1>
                            <p className="text-slate-500 font-bold mt-1">مراجعة طلبات التوثيق وإدارة نظام المنصة</p>
                        </div>
                        <a href="index.html" className="text-indigo-600 font-bold hover:underline">العودة للمنصة &rarr;</a>
                    </header>

                    <div className="flex gap-3 mb-6">
                        <button onClick={() => setActiveTab('requests')} className={`px-5 py-2.5 font-black text-sm rounded-xl transition-all shadow-sm ${activeTab === 'requests' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border-2 border-slate-200 hover:border-indigo-300'}`}>طلبات التوثيق ⏳</button>
                        <button onClick={() => setActiveTab('admins')} className={`px-5 py-2.5 font-black text-sm rounded-xl transition-all shadow-sm ${activeTab === 'admins' ? 'bg-purple-600 text-white' : 'bg-white text-slate-500 border-2 border-slate-200 hover:border-purple-300'}`}>نظام المديرين 👑</button>
                        <button onClick={() => setActiveTab('dict')} className={`px-5 py-2.5 font-black text-sm rounded-xl transition-all shadow-sm ${activeTab === 'dict' ? 'bg-yellow-500 text-white' : 'bg-white text-slate-500 border-2 border-slate-200 hover:border-yellow-300'}`}>القاموس المفقود 📘</button>
                    </div>

                    {error && <div className="bg-red-100 text-red-600 border-2 border-red-300 p-4 rounded-xl font-bold mb-4">{error}</div>}

                    {loading ? (
                        <div className="text-center py-20 text-slate-400 font-bold">جاري التحميل... ⏳</div>
                    ) : activeTab === 'requests' ? (
                        pendingUsers.length === 0 ? (
                            <div className="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                <div className="text-5xl mb-4">🎉</div>
                                <h2 className="text-xl font-black text-slate-700">لا يوجد طلبات توثيق معلقة!</h2>
                                <p className="text-slate-500">تمت مراجعة جميع الطلبات بنجاح.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {pendingUsers.map(user => (
                                    <div key={user.id} className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="w-12 h-12 rounded-full flex items-center justify-center text-2xl" style={{ backgroundColor: '#f8fafc' }}>
                                                {user.avatar || '👨‍🏫'}
                                            </div>
                                            <div>
                                                <div className="font-black text-slate-800 text-lg">{user.name}</div>
                                                <div className="text-xs font-bold text-slate-500">{user.email}</div>
                                            </div>
                                        </div>
                                        <div className="mb-4">
                                            <a href={user.verificationProof} target="_blank" className="block relative group overflow-hidden rounded-xl border-2 border-indigo-100 hover:border-indigo-400">
                                                <img src={user.verificationProof} alt="وثيقة إثبات" className="w-full h-40 object-cover" />
                                                <div className="absolute inset-0 bg-indigo-900/40 hidden group-hover:flex items-center justify-center text-white font-bold backdrop-blur-sm transition-all">
                                                    تكبير الصورة 🔍
                                                </div>
                                            </a>
                                        </div>
                                        <div className="flex gap-2 mt-4">
                                            <button
                                                onClick={() => handleRequest(user.id, true)}
                                                disabled={actionLoading === user.id}
                                                className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 rounded-xl text-sm transition-colors disabled:opacity-50"
                                            >
                                                ✔️ تفعيل أستاذ
                                            </button>
                                            <button
                                                onClick={() => handleRequest(user.id, false)}
                                                disabled={actionLoading === user.id}
                                                className="flex-none bg-red-100 hover:bg-red-200 text-red-600 font-bold px-4 py-2 rounded-xl text-sm transition-colors disabled:opacity-50"
                                                title="رفض"
                                            >
                                                ❌
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )
                    ) : activeTab === 'admins' ? (
                        <div>
                            <div className="bg-white p-6 rounded-2xl border-2 border-purple-100 shadow-sm mb-6 max-w-2xl mx-auto">
                                <h2 className="text-lg font-black mb-4 text-purple-800 flex items-center gap-2"><span>🛡️</span> ترقية أستاذ لمدير عبر الإيميل</h2>
                                <form onSubmit={handleMakeAdmin} className="flex flex-col sm:flex-row gap-3">
                                    <input type="email" value={newAdminEmail} onChange={e => setNewAdminEmail(e.target.value)} required placeholder="Email Address..." className="flex-1 bg-slate-50 border-2 border-slate-200 p-3 text-sm font-bold rounded-xl focus:outline-none focus:border-purple-400 text-left" dir="ltr" />
                                    <button type="submit" disabled={adminActionLoading === true} className="bg-purple-600 hover:bg-purple-700 text-white font-black px-6 py-3 rounded-xl transition-colors disabled:opacity-50 whitespace-nowrap">ترقية لمدير 👑</button>
                                </form>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {admins.map(admin => (
                                    <div key={admin.id} className="bg-white rounded-2xl p-5 border-2 border-purple-100 shadow-sm">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="w-12 h-12 rounded-full flex items-center justify-center text-2xl bg-purple-50">
                                                {admin.avatar || '👑'}
                                            </div>
                                            <div className="overflow-hidden">
                                                <div className="font-black text-purple-900 text-lg truncate">{admin.name}</div>
                                                <div className="text-xs font-bold text-slate-500 truncate" dir="ltr">{admin.email}</div>
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => handleRevokeAdmin(admin.id)}
                                            disabled={actionLoading === admin.id}
                                            className="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-xl text-sm transition-colors disabled:opacity-50 border border-red-200"
                                        >
                                            سحب الصلاحية ❌
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : activeTab === 'dict' ? (
                        <div>
                            <div className="bg-white p-6 rounded-2xl border-2 border-yellow-200 shadow-sm mb-6 max-w-2xl mx-auto text-center">
                                <h2 className="text-xl font-black mb-2 text-yellow-800">كلمات يبحث عنها التلاميذ ولم يجدوها 📘</h2>
                                <p className="text-sm font-bold text-slate-500">قم بإضافة هذه المصطلحات إلى قاعدة القاموس عند الحاجة ثم احذفها من هنا.</p>
                            </div>

                            {missingTerms.length === 0 ? (
                                <div className="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                    <div className="text-5xl mb-4">🙌</div>
                                    <h2 className="text-xl font-black text-slate-700">القاموس يلبّي الحاجة!</h2>
                                    <p className="text-slate-500">لا توجد مصطلحات مفقودة حالياً في قاعدة البيانات.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {missingTerms.map(term => (
                                        <div key={term.id} className="bg-white rounded-2xl p-5 border-2 border-yellow-200 shadow-sm flex flex-col justify-between">
                                            <div className="mb-4 text-center">
                                                <div className="font-black text-yellow-900 text-2xl truncate mb-1">"{term.term}"</div>
                                                <div className="text-xs font-bold text-slate-500" dir="ltr">{new Date(term.timestamp).toLocaleString('ar-DZ')}</div>
                                            </div>
                                            <button
                                                onClick={() => handleDeleteTerm(term.id)}
                                                disabled={actionLoading === term.id}
                                                className="w-full bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold py-2 rounded-xl text-sm transition-colors disabled:opacity-50 border border-slate-200 mt-2"
                                            >
                                                تمت الإضافة / حذف 🧹
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminDashboard />);
    </script>
</body>

</html>
