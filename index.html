<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فضاء الرياضيات - منصة تعليمية</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>

    <!-- مكتبة KaTeX للرياضيات -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

        body {
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
        }

        .bg-dots {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .btn-3d {
            transition: all 0.1s ease;
        }

        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 currentColor !important;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #c7d2fe;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #a5b4fc;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #818cf8;
        }

        .katex-display {
            margin: 1em 0;
            direction: ltr;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .katex {
            direction: ltr;
            display: inline-block;
        }

        @keyframes scrollText {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .animate-scroll {
            display: inline-block;
            white-space: nowrap;
            animation: scrollText 25s linear infinite;
        }

        .animate-scroll:hover {
            animation-play-state: paused;
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-modal {
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ===== أنماط مختبر التعلم ===== */
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            0% {
                opacity: 0;
                transform: translateX(40px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .tools-hub-overlay {
            animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tool-card-anim {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .tool-card-anim:nth-child(1) {
            animation-delay: 0.03s;
        }

        .tool-card-anim:nth-child(2) {
            animation-delay: 0.06s;
        }

        .tool-card-anim:nth-child(3) {
            animation-delay: 0.09s;
        }

        .tool-card-anim:nth-child(4) {
            animation-delay: 0.12s;
        }

        .tool-card-anim:nth-child(5) {
            animation-delay: 0.15s;
        }

        .tool-card-anim:nth-child(6) {
            animation-delay: 0.18s;
        }

        .tool-card-anim:nth-child(7) {
            animation-delay: 0.21s;
        }

        .tool-card-anim:nth-child(8) {
            animation-delay: 0.24s;
        }

        .tool-card {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-6px) scale(1.03);
        }

        .tool-card:active {
            transform: translateY(-2px) scale(1.01);
        }

        /* shimmer gradient on active tool card */
        .tool-card-shimmer {
            background-size: 200% auto;
            animation: shimmer 2.5s linear infinite;
        }

        .tool-viewer-anim {
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Quick Nav Bar (mobile) */
        .quick-nav {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .quick-nav-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .quick-nav-btn:hover,
        .quick-nav-btn.active {
            transform: translateY(-4px);
        }

        /* iframe container */
        .tool-iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* هندسة الشاشة الكاملة للعرض */
        .viewer-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .viewer-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            flex-shrink: 0;
        }

        .viewer-body {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .viewer-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            flex-direction: column;
            gap: 16px;
            font-weight: 700;
            color: #6366f1;
            font-size: 1.1rem;
        }

        /* hub header gradient */
        .hub-header-grad {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
        }

        /* scrollbar for tools grid */
        .tools-grid-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .tools-grid-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .tools-grid-scroll::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 6px;
        }

        /* نبضة النقاط */
        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid currentColor;
            animation: pulse-ring 1.5s infinite;
        }
    </style>
</head>

<body class="bg-dots text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyB_4sqWF0WVCojlC9TJajkaLIDLKDUjDsg",
            authDomain: "mathspace2026-d314c.firebaseapp.com",
            projectId: "mathspace2026-d314c",
            storageBucket: "mathspace2026-d314c.firebasestorage.app",
            messagingSenderId: "151688129928",
            appId: "1:151688129928:web:cccef753f6c309bbc6de3d",
            measurementId: "G-ND226S3281"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // تصدير Firebase للاستخدام من ملفات خارجية (dashboard.js, script.js)
        window.firebaseDB = db;
        window.firebaseAuth = auth;
        window.firebaseSetDoc = setDoc;
        window.firebaseDoc = doc;
        window.firebaseGetDoc = getDoc;
        window.firebaseUpdateDoc = updateDoc;
        window.firebaseOnAuthStateChanged = onAuthStateChanged;

        const { useState, useEffect, useRef } = React;

        const CLOUDINARY_CLOUD_NAME = "qxi0yh6c";
        const CLOUDINARY_UPLOAD_PRESET = "jvwct9uc";
        const SECRET_ADMIN_CODE = "math2026";

        const CLASSES = [
            { id: 'class_1am', name: 'السنة الأولى متوسط' },
            { id: 'class_2am', name: 'السنة الثانية متوسط' },
            { id: 'class_3am', name: 'السنة الثالثة متوسط' },
            { id: 'class_4am', name: 'السنة الرابعة متوسط' }
        ];

        const TOPICS = [
            { id: 'general', name: 'عام 📝', color: 'bg-slate-100 text-slate-700 border-slate-200' },
            { id: 'algebra', name: 'أنشطة عددية 🧮', color: 'bg-blue-100 text-blue-700 border-blue-200' },
            { id: 'geometry', name: 'أنشطة هندسية 📐', color: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
            { id: 'statistics', name: 'تنظيم معطيات 📊', color: 'bg-purple-100 text-purple-700 border-purple-200' }
        ];

        const AVATARS = ['👦', '👧', '👨‍🎓', '👩‍🎓', '🧑‍🏫', '👩‍🏫', '👨‍🏫', '🤓', '😎', '💡', '🚀', '🌟', '🦊', '🐼', '🦁', '🦉'];
        const COLORS = ['bg-indigo-100 text-indigo-600 border-indigo-200', 'bg-emerald-100 text-emerald-600 border-emerald-200', 'bg-blue-100 text-blue-600 border-blue-200', 'bg-purple-100 text-purple-600 border-purple-200', 'bg-orange-100 text-orange-600 border-orange-200', 'bg-rose-100 text-rose-600 border-rose-200'];

        const getBadge = (points = 0) => {
            if (points >= 100) return { icon: '👑', title: 'أسطورة', color: 'text-yellow-700 bg-gradient-to-r from-yellow-200 to-yellow-400 border border-yellow-500 shadow-sm' };
            if (points >= 50) return { icon: '💎', title: 'محترف', color: 'text-cyan-700 bg-gradient-to-r from-cyan-100 to-cyan-300 border border-cyan-400 shadow-sm' };
            if (points >= 20) return { icon: '🚀', title: 'مجتهد', color: 'text-purple-700 bg-gradient-to-r from-purple-100 to-purple-300 border border-purple-400 shadow-sm' };
            return { icon: '🌱', title: 'مبتدئ', color: 'text-emerald-700 bg-gradient-to-r from-emerald-100 to-emerald-200 border border-emerald-300 shadow-sm' };
        };

        const Avatar = ({ emoji, className = "w-12 h-12 text-2xl" }) => {
            const isUrl = typeof emoji === 'string' && (emoji.startsWith('http') || emoji.startsWith('data:image'));
            return (
                <div className={`flex items-center justify-center rounded-2xl flex-shrink-0 border-2 shadow-sm overflow-hidden bg-white ${className}`}>
                    {isUrl ? (
                        <img src={emoji} alt="Avatar" className="w-full h-full object-cover" />
                    ) : (
                        emoji
                    )}
                </div>
            );
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const variants = {
                primary: "bg-gradient-to-b from-indigo-500 to-indigo-600 text-white shadow-[0_4px_0_0_#4338ca] hover:from-indigo-400 hover:to-indigo-500 text-[#4338ca]",
                secondary: "bg-white text-slate-700 border-2 border-slate-200 shadow-[0_4px_0_0_#cbd5e1] hover:bg-slate-50 text-[#cbd5e1]",
                success: "bg-gradient-to-b from-emerald-500 to-emerald-600 text-white shadow-[0_4px_0_0_#047857] hover:from-emerald-400 hover:to-emerald-500 text-[#047857]",
                danger: "bg-gradient-to-b from-red-500 to-red-600 text-white shadow-[0_4px_0_0_#b91c1c] hover:from-red-400 hover:to-red-500 text-[#b91c1c]",
                ghost: "bg-transparent text-slate-500 hover:bg-slate-100 border-none",
            };
            return (
                <button className={`btn-3d inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-bold rounded-2xl disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center bg-red-50 p-6">
                            <div className="text-6xl mb-4">🚨</div>
                            <h1 className="text-2xl font-black text-red-600 mb-2">عذراً، حدث خطأ!</h1>
                            <div className="bg-white p-4 rounded-xl border border-red-200 text-red-500 font-mono text-sm max-w-lg overflow-auto" dir="ltr">{this.state.error.message}</div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const OnboardingScreen = ({ globalUser, onComplete }) => {
            const [role, setRole] = useState('student');
            const [classId, setClassId] = useState(CLASSES[0].id);
            const [adminCode, setAdminCode] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = () => {
                if (role === 'teacher' && adminCode !== SECRET_ADMIN_CODE) { setError('الرمز السري للإدارة غير صحيح 🛑'); return; }
                onComplete(role, classId, adminCode);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
                    <div className="bg-white p-8 rounded-[2rem] shadow-xl max-w-md w-full border-2 border-slate-100 text-center animate-modal">
                        <div className="text-6xl mb-4">🦸‍♂️</div>
                        <h2 className="text-2xl font-black mb-2">أهلاً بك يا {globalUser.name}!</h2>
                        <p className="text-slate-500 mb-6 font-bold text-sm">خطوة أخيرة لتجهيز حسابك...</p>
                        {error && <div className="bg-red-100 text-red-600 border-2 border-red-200 p-3 rounded-2xl text-sm font-bold mb-4">{error}</div>}
                        <div className="space-y-4 text-right">
                            <label className="block text-sm font-bold text-slate-700">أنا...</label>
                            <select value={role} onChange={e => setRole(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none shadow-sm cursor-pointer">
                                <option value="student">تلميذ 🎮</option>
                                <option value="teacher">أستاذة 👩‍🏫</option>
                            </select>
                            {role === 'student' && (
                                <>
                                    <label className="block text-sm font-bold text-slate-700 mt-2">قسمي هو:</label>
                                    <select value={classId} onChange={e => setClassId(e.target.value)} className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none shadow-sm cursor-pointer text-indigo-700">
                                        {CLASSES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </>
                            )}
                            {role === 'teacher' && (
                                <>
                                    <label className="block text-sm font-bold text-slate-700 mt-2">الرمز السري للإدارة:</label>
                                    <input type="password" value={adminCode} onChange={e => setAdminCode(e.target.value)} placeholder="الرمز السري 🤫" className="w-full bg-purple-50 border-2 border-purple-200 text-purple-800 rounded-2xl p-4 text-sm font-bold focus:outline-none shadow-sm" />
                                </>
                            )}
                            <Button onClick={handleSubmit} className="w-full py-4 mt-2">حفظ ودخول المنصة 🚀</Button>
                        </div>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ setGlobalOnboardingUser }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [isForgot, setIsForgot] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [role, setRole] = useState('student');
            const [classId, setClassId] = useState(CLASSES[0].id);
            const [error, setError] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [adminCode, setAdminCode] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleEmailSubmit = async (e) => {
                e.preventDefault();
                setError(''); setIsLoading(true);
                try {
                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, email, password);
                    } else {
                        if (password.length < 6) { setError('كلمة المرور يجب أن تكون 6 رموز على الأقل 🔐'); setIsLoading(false); return; }
                        if (!name.trim()) { setError('لا تنسَ كتابة اسمك البطل! 🦸‍♂️'); setIsLoading(false); return; }
                        if (role === 'teacher' && adminCode !== SECRET_ADMIN_CODE) { setError('الرمز السري للإدارة غير صحيح 🛑'); setIsLoading(false); return; }

                        const userCred = await createUserWithEmailAndPassword(auth, email, password);
                        await setDoc(doc(db, 'users', userCred.user.uid), {
                            name: name.trim(), role, email: userCred.user.email,
                            classId: role === 'student' ? classId : null,
                            avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)], color: COLORS[Math.floor(Math.random() * COLORS.length)],
                            points: 0, joinedAt: Date.now(), bannedUntil: null
                        });
                    }
                } catch (err) {
                    setError(err.message.includes('invalid-credential') ? 'البيانات غير صحيحة ❌' : 'تأكد من البيانات أو أن البريد مستخدم مسبقاً 🧐');
                }
                setIsLoading(false);
            };

            const handleGoogleSignIn = async () => {
                setError(''); setIsLoading(true);
                try {
                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(auth, provider);
                    const docSnap = await getDoc(doc(db, 'users', result.user.uid));
                    if (!docSnap.exists()) {
                        setGlobalOnboardingUser({
                            uid: result.user.uid, email: result.user.email, name: result.user.displayName || 'بطل جديد',
                            avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)], color: COLORS[Math.floor(Math.random() * COLORS.length)],
                            points: 0, joinedAt: Date.now(), bannedUntil: null
                        });
                    }
                } catch (err) { setError('حدث خطأ أثناء الدخول بحساب جوجل.'); }
                setIsLoading(false);
            };

            const handleForgotSubmit = async (e) => {
                e.preventDefault();
                setError(''); setSuccessMsg(''); setIsLoading(true);
                try {
                    await sendPasswordResetEmail(auth, email);
                    setSuccessMsg('✅ تم إرسال رابط استعادة كلمة المرور إلى بريدك!');
                    setTimeout(() => { setIsForgot(false); setIsLogin(true); setEmail(''); setSuccessMsg(''); }, 5000);
                } catch (err) { setError('عذراً، البريد غير صحيح أو غير مسجل.'); }
                setIsLoading(false);
            };

            if (isForgot) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="w-full max-w-md bg-white rounded-[2rem] shadow-2xl border-4 border-slate-100 overflow-hidden animate-modal">
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-500 p-6 text-center text-white">
                                <h2 className="text-2xl font-black mb-1">استعادة كلمة المرور 🔑</h2>
                            </div>
                            <div className="p-8">
                                <button type="button" onClick={() => setIsForgot(false)} className="text-sm text-slate-500 hover:text-indigo-600 font-bold mb-4 flex items-center gap-1">🔙 عودة</button>
                                {error && <div className="bg-red-100 text-red-600 border-2 border-red-200 p-3 rounded-2xl text-sm font-bold mb-4">{error}</div>}
                                {successMsg && <div className="bg-emerald-100 text-emerald-700 border-2 border-emerald-200 p-3 rounded-2xl text-sm font-bold mb-4">{successMsg}</div>}
                                <form onSubmit={handleForgotSubmit} className="space-y-4">
                                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="البريد الإلكتروني المسجل" className="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 text-base font-medium focus:outline-none focus:border-indigo-500 transition-colors shadow-inner" dir="ltr" />
                                    <Button type="submit" disabled={isLoading} className="w-full py-4 mt-6 text-lg">{isLoading ? 'جاري الإرسال...' : 'إرسال الرابط 📩'}</Button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="w-full max-w-md bg-white rounded-[2.5rem] shadow-[0_20px_50px_rgba(8,_112,_184,_0.07)] border-4 border-white overflow-hidden relative">
                        <div className="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-10 text-center text-white relative overflow-hidden">
                            <div className="text-5xl mb-4 relative z-10 animate-bounce">🚀</div>
                            <h1 className="text-3xl font-black mb-1 relative z-10 tracking-tight text-white drop-shadow-md">فضاء الرياضيات</h1>
                        </div>
                        <div className="p-8 bg-slate-50">
                            <button type="button" onClick={handleGoogleSignIn} disabled={isLoading} className="w-full py-3.5 mb-5 bg-white border-2 border-slate-200 text-slate-700 font-bold rounded-2xl hover:bg-slate-50 transition-all flex items-center justify-center gap-3 shadow-sm card-hover">
                                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
                                الدخول بحساب Google
                            </button>
                            <div className="flex bg-slate-200 p-1.5 rounded-2xl mb-6 shadow-inner border border-slate-300/50">
                                <button type="button" className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${isLogin ? 'bg-white text-indigo-700 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700'}`} onClick={() => { setIsLogin(true); setError(''); }}>تسجيل دخول</button>
                                <button type="button" className={`flex-1 py-2.5 text-sm font-bold rounded-xl transition-all ${!isLogin ? 'bg-white text-indigo-700 shadow-sm border border-slate-100' : 'text-slate-500 hover:text-slate-700'}`} onClick={() => { setIsLogin(false); setError(''); }}>حساب جديد</button>
                            </div>
                            {error && <div className="bg-red-100 text-red-600 border-2 border-red-200 p-3 rounded-2xl text-sm font-bold mb-4 animate-pulse">{error}</div>}
                            <form onSubmit={handleEmailSubmit} className="space-y-4">
                                {!isLogin && (
                                    <>
                                        <input type="text" required value={name} onChange={e => setName(e.target.value)} placeholder="اسمك البطل (الاسم الكامل) 🦸‍♂️" className="w-full bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 transition-all shadow-sm" />
                                        <div className="flex gap-3">
                                            <select value={role} onChange={e => setRole(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none shadow-sm cursor-pointer">
                                                <option value="student">تلميذ 🎮</option>
                                                <option value="teacher">أستاذة 👩‍🏫</option>
                                            </select>
                                            {role === 'student' && (
                                                <select value={classId} onChange={e => setClassId(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none shadow-sm cursor-pointer text-indigo-700">
                                                    {CLASSES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                                </select>
                                            )}
                                        </div>
                                        {role === 'teacher' && <input type="password" required value={adminCode} onChange={e => setAdminCode(e.target.value)} placeholder="الرمز السري للإدارة 🤫" className="w-full bg-purple-50 border-2 border-purple-200 text-purple-800 rounded-2xl p-4 text-sm font-bold focus:outline-none shadow-sm" />}
                                    </>
                                )}
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="البريد الإلكتروني 📧" className="w-full bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none focus:border-indigo-400 transition-all" dir="ltr" />
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="كلمة المرور 🔒" className="w-full bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-bold focus:outline-none focus:border-indigo-400 transition-all" dir="ltr" />
                                <Button type="submit" disabled={isLoading} className="w-full py-4 mt-6 text-lg">{isLoading ? 'جاري التحميل...' : (isLogin ? 'انطلق للتعلم! 🚀' : 'ابدأ المغامرة! ✨')}</Button>
                                {isLogin && <button type="button" onClick={() => setIsForgot(true)} className="w-full text-center mt-6 text-sm font-bold text-slate-400 hover:text-indigo-600 transition-colors">🤔 نسيت كلمة المرور؟</button>}
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileModal = ({ user, appUsers, onClose, onUpdateProfile }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [editName, setEditName] = useState(user.name);
            const [editAvatar, setEditAvatar] = useState(user.avatar);
            const [editClassId, setEditClassId] = useState(user.classId);
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);

            const classmates = appUsers.filter(u => u.role === 'student' && u.classId === user.classId);
            classmates.sort((a, b) => (b.points || 0) - (a.points || 0));
            const rank = classmates.findIndex(u => u.id === user.id) + 1;
            const badge = getBadge(user.points);

            const handleSave = () => {
                if (onUpdateProfile) onUpdateProfile(user.id, editName, editAvatar, editClassId);
                setIsEditing(false);
            };

            const handleAvatarUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: formData });
                    const data = await res.json();
                    if (data.secure_url) setEditAvatar(data.secure_url);
                } catch (error) {
                    console.error("تعذر رفع الصورة، يرجى المحاولة لاحقاً.");
                } finally {
                    setIsUploading(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden animate-modal border-4 border-white relative">
                        {!isEditing && (
                            <button onClick={() => setIsEditing(true)} className="absolute top-4 left-4 w-8 h-8 flex items-center justify-center bg-white/20 text-white rounded-xl hover:bg-white/40 backdrop-blur-sm z-10 transition-colors shadow-sm" title="تعديل الملف الشخصي">✏️</button>
                        )}
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-white/20 text-white rounded-full hover:bg-white/40 backdrop-blur-sm z-10 transition-colors">✕</button>
                        <div className="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-8 text-center text-white relative">
                            {isEditing ? (
                                <div className="mb-4 relative w-fit mx-auto">
                                    <Avatar emoji={editAvatar} className={`w-24 h-24 text-5xl mx-auto border-4 border-white shadow-xl ${user.color}`} />
                                    <input type="file" accept="image/*" ref={fileInputRef} onChange={handleAvatarUpload} className="hidden" id="avatar-upload" />
                                    <label htmlFor="avatar-upload" className="absolute -bottom-2 -right-2 bg-white text-indigo-600 p-2 rounded-xl shadow-lg cursor-pointer hover:bg-indigo-50 transition-colors text-sm font-bold border-2 border-indigo-100 z-10 btn-3d">
                                        {isUploading ? '⏳' : '📸 تغيير'}
                                    </label>
                                </div>
                            ) : (
                                <Avatar emoji={user.avatar} className={`w-24 h-24 text-5xl mx-auto mb-4 border-4 border-white shadow-xl ${user.color}`} />
                            )}

                            {isEditing ? (
                                <input type="text" value={editName} onChange={(e) => setEditName(e.target.value)} className="w-full bg-white/20 border-2 border-white/40 rounded-xl px-3 py-2 text-white text-center font-bold outline-none focus:bg-white/30 backdrop-blur-sm placeholder:text-white/50" placeholder="اسمك الجديد" />
                            ) : (
                                <h2 className="text-2xl font-black mb-1 drop-shadow-md">{user.name}</h2>
                            )}

                            {isEditing && user.role === 'student' && (
                                <div className="mt-3">
                                    <select value={editClassId} onChange={(e) => setEditClassId(e.target.value)} className="w-full bg-white/20 border-2 border-white/40 rounded-xl px-3 py-2 text-white text-center font-bold outline-none focus:bg-white/30 backdrop-blur-sm cursor-pointer">
                                        {CLASSES.map(c => <option key={c.id} value={c.id} className="text-slate-800">{c.name}</option>)}
                                    </select>
                                    <div className="text-xs text-white/80 mt-1 font-bold">المستوى الدراسي (ترقية القسم) 🎓</div>
                                </div>
                            )}

                            {!isEditing && (
                                <div className="text-indigo-100 text-sm font-bold bg-white/20 inline-block px-3 py-1 rounded-full border border-white/30 backdrop-blur-sm mt-2">
                                    {user.role === 'teacher' ? 'أستاذة 👑' : CLASSES.find(c => c.id === user.classId)?.name}
                                </div>
                            )}
                        </div>
                        <div className="p-6 bg-slate-50">
                            {isEditing ? (
                                <div className="space-y-3">
                                    <Button onClick={handleSave} className="w-full py-3" disabled={isUploading || !editName.trim()}>حفظ التعديلات ✅</Button>
                                    <Button onClick={() => { setIsEditing(false); setEditName(user.name); setEditAvatar(user.avatar); setEditClassId(user.classId); }} variant="secondary" className="w-full py-3">إلغاء ❌</Button>
                                </div>
                            ) : (
                                user.role === 'student' ? (
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border-2 border-slate-100 shadow-sm">
                                            <div className="text-slate-500 font-bold text-sm">النقاط الحالية</div>
                                            <div className="text-xl font-black text-indigo-700 flex items-center gap-1">{user.points || 0} 🪙</div>
                                        </div>
                                        <div className={`p-4 rounded-2xl border-2 ${badge.color}`}>
                                            <div className="flex items-center justify-between mb-2">
                                                <div className="text-sm font-bold opacity-80">الشارة الحالية</div>
                                                <div className="text-2xl">{badge.icon}</div>
                                            </div>
                                            <div className="text-lg font-black">{badge.title}</div>
                                        </div>
                                        <div className="flex items-center justify-between bg-gradient-to-r from-amber-50 to-orange-50 p-4 rounded-2xl border-2 border-amber-200 shadow-sm">
                                            <div className="text-amber-700 font-bold text-sm flex items-center gap-2">المرتبة في القسم 🏆</div>
                                            <div className="text-xl font-black text-amber-600 bg-white px-3 py-1 rounded-xl shadow-sm">#{rank}</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-6">
                                        <div className="text-4xl mb-4">👑</div>
                                        <h3 className="text-lg font-black text-slate-700">مرحباً بكِ في لوحة التحكم!</h3>
                                    </div>
                                )
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const PostCreator = ({ currentUser, onAddPost, activeClassId }) => {
            const [postType, setPostType] = useState('standard');
            const [content, setContent] = useState('');
            const [imageUrl, setImageUrl] = useState('');
            const [fileUrl, setFileUrl] = useState('');
            const [showAttach, setShowAttach] = useState(false);
            const [targetClass, setTargetClass] = useState(activeClassId === 'all' ? 'all' : activeClassId);
            const [postTopic, setPostTopic] = useState('general');

            const [isUploading, setIsUploading] = useState(false);
            const [uploadErrorMsg, setUploadErrorMsg] = useState('');

            const [qcmQuestion, setQcmQuestion] = useState('');
            const [qcmOptions, setQcmOptions] = useState(['', '', '']);
            const [qcmCorrect, setQcmCorrect] = useState(0);
            const [qcmPoints, setQcmPoints] = useState(10);

            const fileInputRef = useRef(null);
            const inputRefs = useRef({});
            const [focusedField, setFocusedField] = useState('content');

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploadErrorMsg(''); setIsUploading(true);
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: "POST", body: formData });
                    const data = await res.json();
                    if (data.secure_url) { file.type.startsWith('image/') ? setImageUrl(data.secure_url) : setFileUrl(data.secure_url); }
                    else { setUploadErrorMsg("حدث خطأ أثناء الرفع."); }
                } catch (error) { setUploadErrorMsg("تعذر الرفع."); }
                finally { setIsUploading(false); }
            };

            const insertMathSymbol = (template, cursorOffset) => {
                let active = focusedField;
                if (postType === 'standard') active = 'content';
                if (postType === 'qcm' && active === 'content') active = 'qcmQuestion';
                const el = inputRefs.current[active];
                if (!el) return;
                const startPos = el.selectionStart || 0;
                const endPos = el.selectionEnd || 0;
                if (active === 'content') {
                    setContent(content.substring(0, startPos) + template + content.substring(endPos));
                } else if (active === 'qcmQuestion') {
                    setQcmQuestion(qcmQuestion.substring(0, startPos) + template + qcmQuestion.substring(endPos));
                } else if (active.startsWith('qcmOption-')) {
                    const idx = parseInt(active.split('-')[1]);
                    const newOpts = [...qcmOptions];
                    newOpts[idx] = qcmOptions[idx].substring(0, startPos) + template + qcmOptions[idx].substring(endPos);
                    setQcmOptions(newOpts);
                }
                setTimeout(() => { el.focus(); el.setSelectionRange(startPos + cursorOffset, startPos + cursorOffset); }, 0);
            };

            const handleSubmit = () => {
                if (postType === 'standard' && !content.trim() && !imageUrl.trim() && !fileUrl.trim()) return;
                if (postType === 'qcm' && (!qcmQuestion.trim() || qcmOptions.some(opt => !opt.trim()))) return;

                const newPost = {
                    id: Date.now().toString(),
                    author: currentUser,
                    type: postType,
                    content: postType === 'standard' ? content : '',
                    imageUrl: postType === 'standard' ? imageUrl.trim() : '',
                    fileUrl: postType === 'standard' ? fileUrl.trim() : '',
                    qcmData: postType === 'qcm' ? { question: qcmQuestion, options: qcmOptions, correctOption: qcmCorrect, points: qcmPoints } : null,
                    targetClass,
                    topic: postTopic,
                    timestamp: Date.now(), likes: [], comments: [], answeredBy: [], isPinned: false
                };
                onAddPost(newPost);
                setContent(''); setImageUrl(''); setFileUrl(''); setShowAttach(false); setPostTopic('general');
                setQcmQuestion(''); setQcmOptions(['', '', '']); setQcmCorrect(0);
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            return (
                <div className="bg-white rounded-[2rem] p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-2 border-slate-100 mb-8 relative z-10">
                    <div className="flex gap-2 mb-6 bg-slate-100 p-1.5 rounded-2xl w-fit">
                        <button onClick={() => setPostType('standard')} className={`px-4 py-2 text-sm font-bold rounded-xl transition-all ${postType === 'standard' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>📝 درس أو ملاحظة</button>
                        <button onClick={() => setPostType('qcm')} className={`px-4 py-2 text-sm font-bold rounded-xl transition-all flex items-center gap-1 ${postType === 'qcm' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>⚡ تحدي QCM</button>
                    </div>

                    <div className="flex gap-4 mb-4">
                        <Avatar emoji={currentUser.avatar} className={`w-12 h-12 text-2xl ${currentUser.color}`} />
                        <div className="flex-1 w-full overflow-hidden">
                            <div className="flex flex-wrap items-center gap-2 mb-3 bg-indigo-50/50 p-2 rounded-xl border border-indigo-100">
                                <span className="text-xs font-black text-indigo-400 px-1 uppercase tracking-wider">🧮 أدوات:</span>
                                <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => insertMathSymbol('$\\frac{ }{ }$', 7)} className="px-2.5 py-1.5 bg-white border border-slate-200 shadow-sm text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition-colors btn-3d">⅟ كسر</button>
                                <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => insertMathSymbol('$\\sqrt{ }$', 7)} className="px-2.5 py-1.5 bg-white border border-slate-200 shadow-sm text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition-colors btn-3d">√ جذر</button>
                                <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => insertMathSymbol('$x^{ }$', 4)} className="px-2.5 py-1.5 bg-white border border-slate-200 shadow-sm text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition-colors btn-3d">x² قوى</button>
                                <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => insertMathSymbol('$\\pi$', 4)} className="px-2.5 py-1.5 bg-white border border-slate-200 shadow-sm text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-50 transition-colors btn-3d">π</button>
                            </div>

                            {postType === 'standard' ? (
                                <>
                                    <textarea ref={el => inputRefs.current['content'] = el} onFocus={() => setFocusedField('content')} value={content} onChange={e => setContent(e.target.value)} placeholder="ماذا سنتعلم اليوم يا أستاذة؟" className="w-full bg-slate-50 border-2 border-slate-100 focus:border-indigo-300 focus:ring-4 focus:ring-indigo-50 rounded-2xl p-4 text-base resize-none min-h-[120px] outline-none transition-all font-medium" />
                                    {showAttach && (
                                        <div className="mt-3 bg-indigo-50 p-5 rounded-2xl border-2 border-indigo-100 border-dashed">
                                            <div className="flex items-center gap-4 mb-3">
                                                <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" id="file-upload" />
                                                <label htmlFor="file-upload" className="cursor-pointer bg-white text-indigo-600 border-2 border-indigo-200 px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-indigo-50 transition-colors btn-3d"><span>📤</span> اختر ملفاً</label>
                                                {isUploading && <span className="text-sm font-bold text-indigo-600 animate-pulse bg-white px-3 py-1 rounded-full border border-indigo-100 shadow-sm">⏳ جاري الرفع...</span>}
                                            </div>
                                        </div>
                                    )}
                                </>
                            ) : (
                                <div className="space-y-5 bg-gradient-to-br from-emerald-50 to-teal-50 p-5 rounded-2xl border-2 border-emerald-100">
                                    <div>
                                        <label className="text-sm font-black text-emerald-800 mb-2 block flex items-center gap-2">🎯 السؤال الرياضي:</label>
                                        <input type="text" ref={el => inputRefs.current['qcmQuestion'] = el} onFocus={() => setFocusedField('qcmQuestion')} value={qcmQuestion} onChange={e => setQcmQuestion(e.target.value)} placeholder="مثال: حل المعادلة $2x = 4$ هو:" className="w-full bg-white border-2 border-emerald-200 rounded-xl p-3.5 text-base font-bold focus:outline-none shadow-sm" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-black text-emerald-800 mb-2 block">✨ الخيارات (ظللي الإجابة الصحيحة):</label>
                                        <div className="space-y-3">
                                            {qcmOptions.map((opt, idx) => (
                                                <div key={idx} className={`flex items-center gap-3 p-3 rounded-xl border-2 transition-all ${qcmCorrect === idx ? 'bg-emerald-100 border-emerald-400' : 'bg-white border-slate-200'}`}>
                                                    <input type="radio" name="correctOption" checked={qcmCorrect === idx} onChange={() => setQcmCorrect(idx)} className="w-5 h-5 cursor-pointer text-emerald-600" />
                                                    <input type="text" ref={el => inputRefs.current[`qcmOption-${idx}`] = el} onFocus={() => setFocusedField(`qcmOption-${idx}`)} value={opt} onChange={e => { const newOpts = [...qcmOptions]; newOpts[idx] = e.target.value; setQcmOptions(newOpts); }} placeholder={`الخيار رقم ${idx + 1}`} className="flex-1 bg-transparent text-base font-bold outline-none text-slate-700" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 mt-4 border-t-2 border-emerald-100 pt-4">
                                        <span className="text-sm font-black text-emerald-800">🏆 الجائزة:</span>
                                        <select value={qcmPoints} onChange={e => setQcmPoints(Number(e.target.value))} className="bg-white border-2 border-yellow-300 text-yellow-700 font-black rounded-xl text-sm p-2 outline-none cursor-pointer shadow-sm">
                                            <option value={10}>10 نقاط 🪙</option><option value={20}>20 نقطة 💎</option><option value={50}>50 نقطة 👑</option>
                                        </select>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="flex flex-wrap items-center justify-between pl-14 mt-2 gap-3">
                        <div className="flex flex-wrap gap-2 items-center">
                            <select value={targetClass} onChange={e => setTargetClass(e.target.value)} className={`text-sm font-bold rounded-xl px-3 py-2 cursor-pointer outline-none border-2 shadow-sm transition-colors ${targetClass === 'all' ? 'bg-indigo-100 text-indigo-800 border-indigo-400 ring-2 ring-indigo-100' : 'bg-slate-100 text-slate-700 border-slate-200 hover:border-indigo-300'}`}>
                                <option value="all">📢 إعلان لجميع الأقسام (منشور مشترك)</option>
                                {CLASSES.map(c => <option key={c.id} value={c.id}>إلى: {c.name}</option>)}
                            </select>
                            <select value={postTopic} onChange={e => setPostTopic(e.target.value)} className="bg-slate-100 text-slate-700 text-sm font-bold rounded-xl px-3 py-2 cursor-pointer outline-none border-2 border-slate-200 shadow-sm hover:border-indigo-300">
                                {TOPICS.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                            </select>
                            {postType === 'standard' && (
                                <button onClick={() => setShowAttach(!showAttach)} className="text-sm font-bold px-3 py-2 rounded-xl border-2 bg-white text-slate-500 border-slate-200 hover:text-indigo-600 btn-3d">📎 إرفاق</button>
                            )}
                        </div>

        // ==========================================
        // مكون PhotoViewer (Facebook Style & Drag)
        // ==========================================
        const PhotoViewer = ({ imageUrl, onClose }) => {
            const [zoom, setZoom] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            // تم تصغير نسبة التكبير إلى 0.2 لتحكم أدق
            const handleZoomIn = (e) => { e.stopPropagation(); setZoom(prev => Math.min(prev + 0.2, 5)); };
            const handleZoomOut = (e) => { e.stopPropagation(); setZoom(prev => Math.max(prev - 0.2, 0.2)); };
            const handleReset = (e) => { e.stopPropagation(); setZoom(1); setPosition({ x: 0, y: 0 }); };

            // دوال السحب (Drag and Pan) للفأرة
            const handleMouseDown = (e) => {
                e.stopPropagation();
                e.preventDefault(); // منع سلوك المتصفح الافتراضي لسحب الصور
                setIsDragging(true);
                setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.stopPropagation();
                setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
            };

            const handleMouseUp = (e) => {
                if (isDragging) {
                    e.stopPropagation();
                    setIsDragging(false);
                }
            };

            // دوال السحب لشاشات اللمس (الهواتف)
            const handleTouchStart = (e) => {
                e.stopPropagation();
                setIsDragging(true);
                const touch = e.touches[0];
                setDragStart({ x: touch.clientX - position.x, y: touch.clientY - position.y });
            };

            const handleTouchMove = (e) => {
                if (!isDragging) return;
                e.stopPropagation();
                const touch = e.touches[0];
                setPosition({ x: touch.clientX - dragStart.x, y: touch.clientY - dragStart.y });
            };

            // منع التمرير في المنصة الخلفية عند فتح الصورة
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = 'unset'; };
            }, []);

            return (
                <div
                    className="fixed inset-0 z-[100] bg-black flex flex-col overflow-hidden"
                    onClick={onClose}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleMouseUp}
                >
                    {/* شريط الأزرار العلوي */}
                    <div className="absolute top-0 w-full p-4 flex justify-between items-center z-[110] bg-gradient-to-b from-black/80 to-transparent">
                        <button onClick={onClose} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-xl font-black transition-colors shadow-sm" title="إغلاق">✕</button>
                        <div className="flex gap-3" dir="ltr">
                            <button onClick={handleZoomIn} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-2xl transition-colors shadow-sm" title="تكبير">⊕</button>
                            <button onClick={handleZoomOut} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-2xl transition-colors shadow-sm" title="تصغير">⊖</button>
                            <button onClick={handleReset} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-xl transition-colors shadow-sm" title="احتواء الشاشة">⛶</button>
                        </div>
                    </div>

                    {/* حاوية الصورة مع خاصية السحب والإفلات */}
                    <div className="flex-1 w-full h-full flex items-center justify-center relative">
                        <img
                            src={imageUrl}
                            style={{
                                transform: `translate(${position.x}px, ${position.y}px) scale(${zoom})`,
                                transition: isDragging ? 'none' : 'transform 0.1s ease-out',
                                cursor: isDragging ? 'grabbing' : (zoom > 1 ? 'grab' : 'zoom-in')
                            }}
                            className="max-w-full max-h-[95vh] object-contain select-none shadow-2xl bg-black"
                            onMouseDown={handleMouseDown}
                            onTouchStart={handleTouchStart}
                            onClick={(e) => {
                                e.stopPropagation();
                                if (zoom === 1 && !isDragging) { setZoom(1.5); } // تكبير سريع عند النقر لأول مرة
                            }}
                            draggable="false"
                        />
                    </div>
                </div>
            );
        };
        // ==========================================

                                </div>

                        </div>

                        {isQcm && post.qcmData ? (
                            <div className="mb-5 bg-gradient-to-b from-white to-slate-50 rounded-2xl p-5 border-2 border-slate-100 shadow-inner">

                                    <span className="bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-black px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm">⚡ تحدي سريع</span>
                                    <span className="text-sm font-black text-yellow-600 bg-yellow-100 px-3 py-1.5 rounded-full border border-yellow-300 shadow-sm">الجائزة: {post.qcmData.points || 10} نقطة 🪙</span>
                                </div>
                                <h3 className="font-black text-slate-800 mb-5 text-lg math-content text-center py-2">{post.qcmData.question}</h3>
                                <div className="space-y-3">
                                    {post.qcmData.options.map((opt, idx) => {
                                        let btnClass = "w-full text-right p-4 rounded-2xl border-2 text-base font-bold transition-all ";
                                        if (isTeacher) {

                                        className={`tool-card tool-card-anim bg-white rounded-2xl p-4 sm:p-5 shadow-lg border-2 border-slate-100 hover:border-transparent hover:shadow-xl hover:${tool.shadow} text-right relative overflow-hidden group ${tool.ring} hover:ring-2`}

                                        <div className={`w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br ${tool.gradient} flex items-center justify-center text-2xl sm:text-3xl mb-3 shadow-md group-hover:scale-110 transition-transform duration-300`}>
                                            {tool.icon}
                                        </div>

                                        {/* اسم الأداة */}
                                        <div className="font-black text-slate-800 text-sm sm:text-base mb-1 leading-tight">{tool.name}</div>

                                        {/* وصف مختصر */}
                                        <div className="text-slate-400 text-xs font-bold leading-relaxed">{tool.desc}</div>

                                        {/* شارة */}
                                        <div className={`mt-3 inline-block text-xs font-black px-2.5 py-1 rounded-lg ${tool.badgeColor}`}>{tool.badge}</div>

                                        {/* سهم */}
                                        <div className={`absolute top-3 left-3 w-7 h-7 flex items-center justify-center bg-gradient-to-br ${tool.gradient} text-white rounded-xl opacity-0 group-hover:opacity-100 transition-all duration-300 text-sm font-black shadow-sm`}>→</div>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* تذييل الحوار */}
                        <div className="border-t-2 border-slate-100 p-4 bg-slate-50/80 flex-shrink-0 rounded-b-[2rem]">
                            <p className="text-center text-xs text-slate-400 font-bold">
                                💡 اضغط على أي أداة لفتحها مباشرة داخل فضاء الرياضيات
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================

        const MathSpaceLMS = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [globalOnboardingUser, setGlobalOnboardingUser] = useState(null);
            const [appUsers, setAppUsers] = useState([]);
            const [posts, setPosts] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            const [activeClassId, setActiveClassId] = useState('all');
            const [activeTopic, setActiveTopic] = useState('all');
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [viewingPhoto, setViewingPhoto] = useState(null);
            const [showToolsHub, setShowToolsHub] = useState(false);
            const [activeTool, setActiveTool] = useState(null);

            // مراقبة أزرار المتصفح (الخلف/الأمام) لتغيير الرابط
            useEffect(() => {
                const handlePopState = () => {
                    if (viewingPhoto) setViewingPhoto(null);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [viewingPhoto]);

            const handleOpenPhoto = (url, postId) => {
                window.history.pushState({ photo: postId }, "", `?photo=${postId}`);
                setViewingPhoto(url);
            };

            const handleClosePhoto = () => {
                window.history.back();
            };

            useEffect(() => {
                const renderMath = () => {
                    if (window.renderMathInElement) {
                        const elements = document.querySelectorAll('.post-container .math-content');
                        elements.forEach(el => {
                            window.renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
                        });
                    }
                };
                const timer = setTimeout(renderMath, 300);
                return () => clearTimeout(timer);
            });

            useEffect(() => {
                const unsubscribeAuth = onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        try {
                            const docSnap = await getDoc(doc(db, 'users', user.uid));
                            if (docSnap.exists()) { setCurrentUser({ id: docSnap.id, ...docSnap.data() }); setGlobalOnboardingUser(null); }
                            else {
                                setGlobalOnboardingUser({
                                    uid: user.uid, email: user.email, name: user.displayName || 'بطل جديد',
                                    avatar: AVATARS[Math.floor(Math.random() * AVATARS.length)], color: COLORS[Math.floor(Math.random() * COLORS.length)],
                                    points: 0, joinedAt: Date.now(), bannedUntil: null
                                });
                                setCurrentUser(null);
                            }
                        } catch (e) { }
                    } else { setCurrentUser(null); setGlobalOnboardingUser(null); }
                    setIsLoading(false);
                });

                const unsubscribePosts = onSnapshot(collection(db, 'posts'), (snapshot) => {
                    const fetchedPosts = [];
                    snapshot.forEach((doc) => { fetchedPosts.push({ ...doc.data(), id: doc.id }); });
                    setPosts(fetchedPosts);
                });
                const unsubscribeUsers = onSnapshot(collection(db, 'users'), (snapshot) => {
                    const fetchedUsers = [];
                    snapshot.forEach((doc) => fetchedUsers.push({ ...doc.data(), id: doc.id }));
                    setAppUsers(fetchedUsers);
                });

                return () => { unsubscribeAuth(); unsubscribePosts(); unsubscribeUsers(); };
            }, []);

            useEffect(() => {
                if (currentUser && appUsers.length > 0) {
                    const updatedUser = appUsers.find(u => u.id === currentUser.id);
                    if (updatedUser && JSON.stringify(updatedUser) !== JSON.stringify(currentUser)) {
                        setCurrentUser(updatedUser);
                    }
                }
            }, [appUsers]);

            const handleCompleteOnboarding = async (role, classId, adminCode) => {
                await setDoc(doc(db, 'users', globalOnboardingUser.uid), { ...globalOnboardingUser, role, classId: role === 'student' ? classId : null });
                setCurrentUser({ ...globalOnboardingUser, role, classId: role === 'student' ? classId : null, id: globalOnboardingUser.uid });
                setGlobalOnboardingUser(null);
            };

            const filteredPosts = posts.filter(post => {
                const postTopic = post.topic || 'general';
                const classMatch = currentUser?.role === 'teacher' ? (activeClassId === 'all' || post.targetClass === activeClassId || post.targetClass === 'all') : (post.targetClass === currentUser?.classId || post.targetClass === 'all');
                const topicMatch = activeTopic === 'all' || postTopic === activeTopic;
                return classMatch && topicMatch;
            }).sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return (b.timestamp || 0) - (a.timestamp || 0);
            });

            const topStudents = appUsers.filter(u => u.role === 'student' && u.points > 0).sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 5);

            const handleLogout = () => signOut(auth);
            const handleAddPost = async (newPost) => { await setDoc(doc(db, 'posts', String(newPost.id)), newPost); };
            const handleUpdatePost = async (postId, updates) => { await updateDoc(doc(db, 'posts', String(postId)), updates); };
            const handleDeletePost = async (postId) => { try { await deleteDoc(doc(db, 'posts', String(postId))); } catch (e) { } };
            const handleTogglePin = async (postId, currentPinStatus) => { try { await updateDoc(doc(db, 'posts', String(postId)), { isPinned: !currentPinStatus }); } catch (e) { } };
            const handleRewardStudent = async (studentId, pointsToAdd) => {
                try { const studentData = appUsers.find(u => u.id === studentId); if (studentData) await updateDoc(doc(db, 'users', String(studentId)), { points: (studentData.points || 0) + pointsToAdd }); } catch (error) { }
            };

            const handleBanUser = async (userId, days) => {
                try {
                    const banUntil = Date.now() + (days * 24 * 60 * 60 * 1000);
                    await updateDoc(doc(db, 'users', String(userId)), { bannedUntil: banUntil });
                } catch (error) { console.error("Error banning user:", error); }
            };

            const handleUpdateProfile = async (userId, newName, newAvatar, newClassId) => {
                try {
                    const updates = { name: newName, avatar: newAvatar };
                    if (newClassId) updates.classId = newClassId;
                    await updateDoc(doc(db, 'users', String(userId)), updates);
                } catch (error) { console.error("Error updating profile:", error); }
            };

            if (isLoading) return <div className="min-h-screen flex flex-col items-center justify-center font-bold text-indigo-600 text-xl gap-4"><div className="animate-spin text-4xl">🧮</div> جاري تجهيز الأرقام والمعادلات...</div>;
            if (globalOnboardingUser) return <OnboardingScreen globalUser={globalOnboardingUser} onComplete={handleCompleteOnboarding} />;

            return (
                <ErrorBoundary>

                                        <div className="bg-gradient-to-br from-indigo-500 to-purple-500 text-white w-12 h-12 flex items-center justify-center rounded-2xl text-2xl shadow-md rotate-3">🧮</div>

                                            className="flex items-center gap-2 bg-gradient-to-b from-violet-500 to-purple-600 text-white px-3 sm:px-5 py-2.5 rounded-2xl font-black text-sm shadow-[0_4px_0_0_#5b21b6] hover:from-violet-400 hover:to-purple-500 btn-3d transition-all"
                                            title="مختبر التعلم - أدوات تفاعلية"
                                        >
                                            <span className="text-base">🧰</span>
                                            <span className="hidden sm:inline">مختبر التعلم</span>
                                        </button>
                                        <div className="flex items-center gap-2 sm:gap-3 bg-slate-50 p-1.5 rounded-[1.25rem] border-2 border-slate-100 shadow-inner">
                                            <div className="text-left hidden sm:flex flex-col justify-center px-2">
                                                <div className="text-sm font-black text-slate-800">{currentUser.name}</div>
                                                <div className="text-[10px] text-slate-500 font-bold flex items-center justify-end gap-1 mt-0.5">
                                                    {currentUser.role === 'teacher' ? 'إدارة المنصة 👑' : CLASSES.find(c => c.id === currentUser.classId)?.name}
                                                </div>
                                            </div>
                                            <button onClick={() => setShowProfileModal(true)} className="relative group cursor-pointer btn-3d" title="عرض ملفي الشخصي">
                                                <Avatar emoji={currentUser.avatar} className={`w-11 h-11 ${currentUser.color} border-2 border-white shadow-md group-hover:border-indigo-300 transition-colors`} />
                                                <div className="absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 shadow-sm border border-slate-200">👤</div>
                                            </button>
                                            <div className="w-px h-8 bg-slate-200 mx-1"></div>
                                            <button onClick={handleLogout} className="p-2.5 bg-white border-2 border-slate-200 text-slate-500 rounded-xl hover:bg-red-50 hover:text-red-500 btn-3d shadow-sm">🚪</button>
                                        </div>
                                    </div>
                                </nav>

                                {/* ===== شريط الإعلانات المتحرك ===== */}
                                <div className="bg-gradient-to-r from-indigo-600 via-purple-500 to-pink-500 py-2 px-4 overflow-hidden">
                                    <p className="text-white text-xs font-black text-center">
                                        <span className="animate-scroll inline-block">
                                            🎮 الألعاب التعليمية • 📝 التمارين التفاعلية • 🧮 الآلة الحاسبة العلمية • 📈 الرسم البياني • 📐 المختبر الهندسي • 📊 فضاء الفروض • 📖 القاموس الرياضي • 🏆 تحديات QCM • 🧰 اضغط على مختبر التعلم لتكتشف كل الأدوات 🎮 الألعاب التعليمية • 📝 التمارين التفاعلية • 🧮 الآلة الحاسبة العلمية
                                        </span>
                                    </p>
                                </div>

                                <main className="max-w-5xl mx-auto px-4 py-8 pb-20 md:pb-12 flex flex-col md:flex-row gap-8 relative">
                                    <aside className="w-full md:w-72 flex-shrink-0 z-10 relative">
                                        <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-2 border-slate-100 p-5 sticky top-28">

                                            {/* ===== مختبر التعلم في الشريط الجانبي ===== */}
                                            <div className="mb-6">
                                                <div className="text-xs font-black text-slate-400 mb-3 px-2 uppercase tracking-wider">🧰 مختبر التعلم:</div>
                                                <button
                                                    onClick={() => setShowToolsHub(true)}
                                                    className="w-full bg-gradient-to-br from-violet-500 to-purple-600 text-white rounded-2xl p-4 text-right font-black shadow-lg hover:from-violet-400 hover:to-purple-500 transition-all group relative overflow-hidden btn-3d"
                                                >
                                                    <div className="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                    <div className="text-2xl mb-1">🧰</div>
                                                    <div className="text-sm">مختبر التعلم</div>
                                                    <div className="text-white/70 text-xs font-bold mt-0.5">8 أدوات تفاعلية</div>
                                                    <div className="mt-3 flex flex-wrap gap-1.5">
                                                        {['🎮', '📝', '🧮', '📈', '📐', '📊'].map((ico, i) => (
                                                            <span key={i} className="text-xs bg-white/20 px-2 py-0.5 rounded-lg font-bold border border-white/30">{ico}</span>
                                                        ))}
                                                    </div>
                                                </button>
                                                {/* أزرار وصول سريع للأدوات الشائعة */}
                                                <div className="mt-3 grid grid-cols-3 gap-2">
                                                    {[{ icon: '🎮', name: 'الألعاب', id: 'games' }, { icon: '📝', name: 'التمارين', id: 'exercises' }, { icon: '🧮', name: 'الحاسبة', id: 'calculator' }].map(t => (
                                                        <button

                                                        >
                                                            <span className="text-xl">{t.icon}</span>
                                                            <span>{t.name}</span>
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="border-t-2 border-slate-100 mb-6"></div>


                                            {currentUser.role === 'teacher' && (
                                                <div className="space-y-2 mb-6">
                                                    <div className="text-xs font-black text-slate-400 mb-3 px-2 uppercase tracking-wider">تصفية المنشورات (الأقسام):</div>

                                                    {CLASSES.map(c => <button key={c.id} onClick={() => setActiveClassId(c.id)} className={`w-full text-right px-4 py-3 text-sm rounded-xl font-bold transition-all btn-3d border-2 mt-2 ${activeClassId === c.id ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-white text-slate-600 border-slate-200'}`}>{c.name}</button>)}
                                                </div>
