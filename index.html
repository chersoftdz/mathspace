        // ==========================================
        // مكون PhotoViewer (Facebook Style & Drag)
        // ==========================================
        const PhotoViewer = ({ imageUrl, onClose }) => {
            const [zoom, setZoom] = useState(1);
            const [position, setPosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

            // تم تصغير نسبة التكبير إلى 0.2 لتحكم أدق
            const handleZoomIn = (e) => { e.stopPropagation(); setZoom(prev => Math.min(prev + 0.2, 5)); };
            const handleZoomOut = (e) => { e.stopPropagation(); setZoom(prev => Math.max(prev - 0.2, 0.2)); };
            const handleReset = (e) => { e.stopPropagation(); setZoom(1); setPosition({ x: 0, y: 0 }); };

            // دوال السحب (Drag and Pan) للفأرة
            const handleMouseDown = (e) => {
                e.stopPropagation();
                e.preventDefault(); // منع سلوك المتصفح الافتراضي لسحب الصور
                setIsDragging(true);
                setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.stopPropagation();
                setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
            };

            const handleMouseUp = (e) => {
                if (isDragging) {
                    e.stopPropagation();
                    setIsDragging(false);
                }
            };

            // دوال السحب لشاشات اللمس (الهواتف)
            const handleTouchStart = (e) => {
                e.stopPropagation();
                setIsDragging(true);
                const touch = e.touches[0];
                setDragStart({ x: touch.clientX - position.x, y: touch.clientY - position.y });
            };

            const handleTouchMove = (e) => {
                if (!isDragging) return;
                e.stopPropagation();
                const touch = e.touches[0];
                setPosition({ x: touch.clientX - dragStart.x, y: touch.clientY - dragStart.y });
            };

            // منع التمرير في المنصة الخلفية عند فتح الصورة
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = 'unset'; };
            }, []);

            return (
                <div
                    className="fixed inset-0 z-[100] bg-black flex flex-col overflow-hidden"
                    onClick={onClose}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleMouseUp}
                >
                    {/* شريط الأزرار العلوي */}
                    <div className="absolute top-0 w-full p-4 flex justify-between items-center z-[110] bg-gradient-to-b from-black/80 to-transparent">
                        <button onClick={onClose} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-xl font-black transition-colors shadow-sm" title="إغلاق">✕</button>
                        <div className="flex gap-3" dir="ltr">
                            <button onClick={handleZoomIn} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-2xl transition-colors shadow-sm" title="تكبير">⊕</button>
                            <button onClick={handleZoomOut} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-2xl transition-colors shadow-sm" title="تصغير">⊖</button>
                            <button onClick={handleReset} className="w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center text-xl transition-colors shadow-sm" title="احتواء الشاشة">⛶</button>
                        </div>
                    </div>

                    {/* حاوية الصورة مع خاصية السحب والإفلات */}
                    <div className="flex-1 w-full h-full flex items-center justify-center relative">
                        <img
                            src={imageUrl}
                            style={{
                                transform: `translate(${position.x}px, ${position.y}px) scale(${zoom})`,
                                transition: isDragging ? 'none' : 'transform 0.1s ease-out',
                                cursor: isDragging ? 'grabbing' : (zoom > 1 ? 'grab' : 'zoom-in')
                            }}
                            className="max-w-full max-h-[95vh] object-contain select-none shadow-2xl bg-black"
                            onMouseDown={handleMouseDown}
                            onTouchStart={handleTouchStart}
                            onClick={(e) => {
                                e.stopPropagation();
                                if (zoom === 1 && !isDragging) { setZoom(1.5); } // تكبير سريع عند النقر لأول مرة
                            }}
                            draggable="false"
                        />
                    </div>
                </div>
            );
        };
        // ==========================================

        const Post = ({ post, currentUser, appUsers, onUpdatePost, onDeletePost, onRewardStudent, onTogglePin, onBanUser, onOpenPhoto }) => {

                        <div className="flex items-start justify-between mb-5">
                            <div className="flex gap-4 items-center">

                                <div>
                                    <div className="flex items-center gap-2">
                                        <span className="font-black text-slate-800 text-lg">{safeAuthor.name}</span>
                                        {safeAuthor.role === 'teacher' ? <span className="bg-indigo-100 text-indigo-700 border border-indigo-200 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">{safeAuthor.title || 'أستاذ'} {safeAuthor.title === 'أستاذة' ? '👩‍🏫' : '👨‍🏫'}</span> : <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${getBadge(safeAuthor.points).color}`}>{getBadge(safeAuthor.points).icon} {getBadge(safeAuthor.points).title}</span>}

                                    </div>
                                </div>
                            </div>
                            {isTeacher && (
                                <div className="flex items-center gap-2">
                                    <button onClick={() => onTogglePin(post.id, post.isPinned)} className={`p-2 rounded-xl text-lg transition-colors cursor-pointer border-2 btn-3d ${post.isPinned ? 'text-indigo-600 bg-indigo-50 border-indigo-200' : 'text-slate-400 bg-white border-slate-200'}`} title="تثبيت">📌</button>
                                    <button onClick={() => onDeletePost(post.id)} className="text-red-500 bg-white border-2 border-slate-200 hover:bg-red-50 p-2 rounded-xl text-lg transition-colors cursor-pointer btn-3d" title="حذف">🗑️</button>
                                </div>
                            )}
                        </div>

                        {isQcm && post.qcmData ? (
                            <div className="mb-5 bg-gradient-to-b from-white to-slate-50 rounded-2xl p-5 border-2 border-slate-100 shadow-inner">
                                <div className="flex items-center justify-between mb-4">
                                    <span className="bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-black px-3 py-1.5 rounded-full flex items-center gap-1 shadow-sm">⚡ تحدي سريع</span>

                                    {post.qcmData.options.map((opt, idx) => {
                                        let btnClass = "w-full text-right p-4 rounded-2xl border-2 text-base font-bold transition-all ";
                                        if (isTeacher) {
                                            btnClass += (idx === post.qcmData.correctOption) ? "bg-emerald-50 border-emerald-400 text-emerald-800" : "bg-white border-slate-200 opacity-60";
                                        } else if (myAnswer) {
                                            if (idx === post.qcmData.correctOption) btnClass += "bg-emerald-100 border-emerald-500 text-emerald-900";

                                            else btnClass += "bg-white border-slate-200 text-slate-300 opacity-50";
                                        } else { btnClass += "bg-white border-slate-200 text-slate-700 hover:border-emerald-400 hover:bg-emerald-50 cursor-pointer btn-3d"; }

                                            🎮 الألعاب التعليمية • 📝 التمارين التفاعلية • 🧮 الآلة الحاسبة العلمية • 📈 الرسم البياني • 📐 المختبر الهندسي • 📊 فضاء الفروض • 📖 القاموس الرياضي • 🏆 تحديات QCM • 🧰 اضغط على مختبر التعلم لتكتشف كل الأدوات 🎮 الألعاب التعليمية • 📝 التمارين التفاعلية • 🧮 الآلة الحاسبة العلمية
                                        </span>
                                    </p>
                                </div>

                                <main className="max-w-5xl mx-auto px-4 py-8 pb-20 md:pb-12 flex flex-col md:flex-row gap-8 relative">
                                    <aside className="w-full md:w-72 flex-shrink-0 z-10 relative">
                                        <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border-2 border-slate-100 p-5 sticky top-28">

                                            {currentUser.role === 'teacher' ? (
                                                <div className="space-y-2 mb-6">
                                                    <div className="text-xs font-black text-slate-400 mb-3 px-2 uppercase tracking-wider">تصفية المنشورات (الأقسام):</div>
                                                    <button onClick={() => setActiveClassId('all')} className={`w-full text-right px-4 py-3 text-sm rounded-xl font-bold transition-all btn-3d border-2 ${activeClassId === 'all' ? 'bg-slate-800 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}`}>جميع الأقسام</button>
                                                    {CLASSES.map(c => <button key={c.id} onClick={() => setActiveClassId(c.id)} className={`w-full text-right px-4 py-3 text-sm rounded-xl font-bold transition-all btn-3d border-2 mt-2 ${activeClassId === c.id ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-white text-slate-600 border-slate-200'}`}>{c.name}</button>)}
                                                </div>
                                            ) : currentUser.linkedTeacherId && (
                                                <div className="space-y-2 mb-6">
                                                    <div className="text-xs font-black text-slate-400 mb-3 px-2 uppercase tracking-wider">نطاق المنشورات:</div>
                                                    <div className="flex flex-col gap-2">
                                                        <button onClick={() => setStudentScope('my_class')} className={`w-full text-right px-4 py-3 text-sm rounded-xl font-black transition-all btn-3d border-2 ${studentScope === 'my_class' ? 'bg-indigo-600 text-white border-indigo-700 shadow-md' : 'bg-indigo-50 text-indigo-600 border-indigo-200 hover:bg-indigo-100'}`}>
                                                            🔒 منشورات فصلي فقط
                                                        </button>
                                                        <button onClick={() => setStudentScope('all')} className={`w-full text-right px-4 py-3 text-sm rounded-xl font-black transition-all btn-3d border-2 ${studentScope === 'all' ? 'bg-green-500 text-white border-green-600 shadow-md' : 'bg-green-50 text-green-600 border-green-200 hover:bg-green-100'}`}>
                                                            🌍 المنشورات العامة ومدرستي
                                                        </button>
                                                    </div>
                                                </div>
                                            )}

                                            <div className="border-t-2 border-slate-100 pt-5 bg-gradient-to-b from-transparent to-amber-50/50 rounded-b-[2rem] -mx-5 -mb-5 p-5">
                                                <div className="text-sm font-black text-amber-600 mb-4 px-1 flex items-center gap-2 text-shadow-sm">🏆 أساطير الرياضيات</div>
                                                {topStudents.length === 0 ? (
                                                    <div className="text-center text-xs font-bold text-slate-400 bg-white p-4 rounded-2xl border-2 shadow-sm">لم يجمع أحد نقاطاً بعد!</div>
                                                ) : (
                                                    <div className="space-y-3">
                                                        {topStudents.map((student, index) => (
                                                            <div key={student.id} className={`flex items-center justify-between bg-white p-2.5 rounded-2xl border-2 shadow-sm ${index === 0 ? 'border-amber-300 ring-2 ring-amber-100' : 'border-slate-100'}`}>
                                                                <div className="flex items-center gap-3">
                                                                    <div className={`font-black text-sm w-5 h-5 flex items-center justify-center rounded-full ${index === 0 ? 'bg-amber-100 text-amber-600' : index === 1 ? 'bg-slate-200' : index === 2 ? 'bg-orange-100 text-orange-600' : 'text-slate-300'}`}>{index === 0 ? '👑' : index + 1}</div>
                                                                    <Avatar emoji={student.avatar} className={`w-9 h-9 text-base ${student.color}`} />
                                                                    <div className="text-sm font-black text-slate-700 truncate max-w-[100px]" title={student.name}>{student.name}</div>
                                                                </div>
                                                                <div className="text-xs font-black text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-xl border border-indigo-100">{student.points} 🪙</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </aside>

                                    <div className="flex-1 max-w-2xl min-w-0 z-10 relative">

                                        <div className="flex items-center gap-2 overflow-x-auto no-scrollbar mb-6 p-1">
                                            <button onClick={() => setActiveTopic('all')} className={`px-5 py-2.5 text-sm font-bold rounded-xl whitespace-nowrap transition-all border-2 btn-3d ${activeTopic === 'all' ? 'bg-slate-800 text-white border-slate-900 shadow-md transform -translate-y-0.5' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>
                                                كل المواضيع
                                            </button>
                                            {TOPICS.map(t => (
                                                <button key={t.id} onClick={() => setActiveTopic(t.id)} className={`px-5 py-2.5 text-sm font-bold rounded-xl whitespace-nowrap transition-all border-2 btn-3d ${activeTopic === t.id ? t.color.replace('border-', 'border-').replace('text-', 'text-').replace('bg-', 'bg-').concat(' shadow-md transform -translate-y-0.5 shadow-[0_3px_0_0_currentColor]') : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>
                                                    {t.name}
                                                </button>
                                            ))}
                                        </div>

                                        {currentUser.role === 'teacher' && <PostCreator currentUser={currentUser} onAddPost={handleAddPost} activeClassId={activeClassId} />}

                                        {filteredPosts.length === 0 ? (
                                            <div className="text-center py-16 bg-white rounded-[2rem] border-4 border-dashed border-slate-200 text-slate-500 font-bold shadow-sm">
                                                <div className="text-6xl mb-4 opacity-50">📭</div>
                                                لا توجد مغامرات رياضية حالياً.
                                            </div>
                                        ) : (
                                            filteredPosts.map(post => <Post key={post.id} post={post} currentUser={currentUser} appUsers={appUsers} onUpdatePost={handleUpdatePost} onDeletePost={handleDeletePost} onRewardStudent={handleRewardStudent} onTogglePin={handleTogglePin} onBanUser={handleBanUser} onOpenPhoto={handleOpenPhoto} />)
                                        )}
                                    </div>
                                </main>

                                {/* عرض الصورة ملء الشاشة (فيسبوك ستايل + سحب) */}
                                {viewingPhoto && <PhotoViewer imageUrl={viewingPhoto} onClose={handleClosePhoto} />}

                                {/* ===== مختبر التعلم - نافذة اختيار الأداة ===== */}
                                {showToolsHub && !activeTool && (
                                    <ToolsHub
                                        onClose={() => setShowToolsHub(false)}
                                        onSelectTool={(tool) => { setActiveTool(tool); setShowToolsHub(false); }}
                                    />
                                )}

                                {/* ===== عارض الأداة التفاعلية ===== */}
                                {activeTool && (
                                    <ToolViewer
                                        tool={activeTool}
                                        onClose={() => setActiveTool(null)}
                                    />
                                )}

                                {/* ===== Quick Nav Bar (شريط التنقل السريع للهاتف) ===== */}
                                <div className="quick-nav fixed bottom-0 left-0 right-0 z-[50] bg-white/90 border-t-2 border-slate-200 px-2 py-2 flex items-stretch gap-1 md:hidden shadow-[0_-4px_20px_rgba(0,0,0,0.08)]">
                                    {/* زر الفضاء */}
                                    <button
                                        onClick={() => { setActiveTool(null); setShowToolsHub(false); }}
                                        className="quick-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 active:scale-95 transition-all"
                                    >
                                        <span className="text-xl">🏠</span>
                                        <span className="text-[10px] font-black">الفضاء</span>
                                    </button>
                                    {/* الألعاب */}
                                    <button
                                        onClick={() => setActiveTool(TOOLS.find(t => t.id === 'games'))}
                                        className="quick-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-slate-500 hover:text-pink-600 hover:bg-pink-50 active:scale-95 transition-all"
                                    >
                                        <span className="text-xl">🎮</span>
                                        <span className="text-[10px] font-black">الألعاب</span>
                                    </button>
                                    {/* التمارين */}
                                    <button
                                        onClick={() => setActiveTool(TOOLS.find(t => t.id === 'exercises'))}
                                        className="quick-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-slate-500 hover:text-purple-600 hover:bg-purple-50 active:scale-95 transition-all"
                                    >
                                        <span className="text-xl">📝</span>
                                        <span className="text-[10px] font-black">التمارين</span>
                                    </button>
                                    {/* الحاسبة */}
                                    <button
                                        onClick={() => setActiveTool(TOOLS.find(t => t.id === 'calculator'))}
                                        className="quick-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-blue-50 active:scale-95 transition-all"
                                    >
                                        <span className="text-xl">🧮</span>
                                        <span className="text-[10px] font-black">الحاسبة</span>
                                    </button>
                                    {/* زر مختبر التعلم (المزيد) */}
                                    <button
                                        onClick={() => setShowToolsHub(true)}
                                        className="quick-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 rounded-xl bg-gradient-to-b from-violet-500 to-purple-600 text-white active:scale-95 transition-all shadow-[0_3px_0_0_#5b21b6]"
                                    >
                                        <span className="text-xl">🧰</span>
                                        <span className="text-[10px] font-black">المزيد</span>
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MathSpaceLMS />);
    </script>
</body>

</html>
