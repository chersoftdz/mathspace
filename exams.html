<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فضاء الرياضيات - الفروض والاختبارات</title>
    <link rel="icon" type="image/png" href="أيقونة المنصة النهائية.png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* === خلفية نجوم متحركة === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* === Header === */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-brand .icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .header-brand h1 {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .header-brand p {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        .btn-home {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        /* === Filters === */
        .filters-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 28px;
        }

        .filter-btn {
            padding: 10px 22px;
            border-radius: 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }

        .filter-btn:hover {
            border-color: #6366f1;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.1);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* === Section Title === */
        .section-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* === Exam Cards Grid === */
        .exam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .exam-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .exam-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent);
            border-radius: 50%;
            transform: translate(30px, -30px);
        }

        .exam-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(99, 102, 241, 0.2);
            background: rgba(99, 102, 241, 0.1);
        }

        .exam-card[data-level="1"] {
            --card-color: #6366f1;
        }

        .exam-card[data-level="2"] {
            --card-color: #8b5cf6;
        }

        .exam-card[data-level="3"] {
            --card-color: #ec4899;
        }

        .exam-card[data-level="4"] {
            --card-color: #f59e0b;
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .card-level-badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 800;
            border: 1.5px solid var(--card-color, #6366f1);
            color: var(--card-color, #6366f1);
            background: rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: #64748b;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--card-color, #6366f1), color-mix(in srgb, var(--card-color, #6366f1) 70%, #a855f7));
            color: white;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-start:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* === Active Exam === */
        #activeExam {
            display: none;
        }

        .exam-progress-header {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .q-counter {
            font-weight: 800;
            font-size: 0.95rem;
            color: #a5b4fc;
            white-space: nowrap;
        }

        .progress-track {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 50px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .timer-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .timer-badge.warning {
            animation: pulse 0.8s infinite;
            color: #f87171;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.6
            }
        }

        /* === Question Card === */
        .question-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 20px;
            display: none;
            animation: fadeSlide 0.4s ease;
        }

        .question-card.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .q-number {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .q-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .option-label:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.12);
            transform: translateX(-3px);
        }

        .option-label input[type="radio"] {
            display: none;
        }

        .option-label.selected {
            border-color: #818cf8;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .option-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            background: rgba(255, 255, 255, 0.05);
        }

        .option-label.selected .option-dot {
            border-color: #818cf8;
            background: #6366f1;
        }

        .option-label.selected .option-dot::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
        }

        /* === Nav Buttons === */
        .exam-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.25s;
        }

        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
        }

        .nav-btn.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .nav-btn.primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .nav-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }

        .nav-btn.success:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* === Results Overlay === */
        #resultsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #resultsModal.show {
            display: flex;
        }

        .results-box {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 27, 75, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result-emoji {
            font-size: 5rem;
            margin-bottom: 12px;
        }

        .result-score {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .result-score.excellent {
            color: #34d399;
        }

        .result-score.good {
            color: #60a5fa;
        }

        .result-score.average {
            color: #fbbf24;
        }

        .result-score.fail {
            color: #f87171;
        }

        .result-grade {
            font-size: 1.3rem;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 14px 32px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            margin-bottom: 24px;
            transition: all 0.25s;
        }

        .btn-retry:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .review-section {
            text-align: right;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .review-title {
            font-size: 0.9rem;
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 12px;
        }

        .review-item {
            padding: 12px 16px;
            border-radius: 14px;
            margin-bottom: 10px;
            border: 1px solid;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .review-item.correct {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .review-item.wrong {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .review-item .ri {
            font-weight: 800;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }

        .review-item .ra {
            font-weight: 700;
        }

        .review-item.correct .ra {
            color: #6ee7b7;
        }

        .review-item.wrong .ra {
            color: #fca5a5;
        }

        @media (max-width: 640px) {
            .page-header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-brand {
                flex-direction: column;
            }

            .q-text {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header class="page-header">
            <div class="header-brand">
                <div class="icon">📝</div>
                <div>
                    <h1>فضاء الفروض والاختبارات</h1>
                    <p>اختبر معلوماتك في ظروف امتحان حقيقية</p>
                </div>
            </div>
            <a href="javascript:window.location.href='./'" class="btn-home">🏠 الرئيسية</a>
        </header>

        <!-- Timer (داخل شريط التقدم) -->
        <div id="examQHeader" class="exam-progress-header" style="display:none">
            <span class="q-counter" id="questionCounter">السؤال 1 / 10</span>
            <div class="progress-track">
                <div class="progress-fill" id="examProgress"></div>
            </div>
            <div class="timer-badge" id="timerBadge">⏱️ <span id="timeDisplay">00:00</span></div>
        </div>

        <!-- قائمة الاختبارات -->
        <section id="examSelection">
            <div class="section-title">✦ اختر الاختبار الذي تريده ✦</div>
            <div class="filters-bar">
                <button class="filter-btn active" onclick="filterExams('all', this)">الكل</button>
                <button class="filter-btn" onclick="filterExams(1, this)">السنة الأولى</button>
                <button class="filter-btn" onclick="filterExams(2, this)">السنة الثانية</button>
                <button class="filter-btn" onclick="filterExams(3, this)">السنة الثالثة</button>
                <button class="filter-btn" onclick="filterExams(4, this)">السنة الرابعة</button>
            </div>
            <div class="exam-grid" id="examsGrid">
                <!-- تحقن البطاقات عبر JS -->
            </div>
        </section>

        <!-- قسم الاختبار النشط -->
        <section id="activeExam">
            <div id="questionsContainer"></div>
            <div class="exam-nav">
                <button id="prevBtn" class="nav-btn secondary" disabled>→ السابق</button>
                <button id="submitExamBtn" class="nav-btn success" style="display:none">✅ تسليم الورقة</button>
                <button id="nextBtn" class="nav-btn primary">التالي ←</button>
            </div>
        </section>

    </div>

    <!-- نافذة النتائج -->
    <div id="resultsModal">
        <div class="results-box">
            <div class="result-emoji" id="resultEmoji">🏆</div>
            <div class="result-score" id="scoreDisplay">0/20</div>
            <div class="result-grade" id="gradeDisplay">ممتاز</div>
            <div class="result-stats">
                <div class="stat-pill">⏱️ <span id="timeTaken">00:00</span></div>
                <div class="stat-pill">✅ الصحيحة: <span id="correctCount">0</span></div>
            </div>
            <button class="btn-retry" onclick="window.location.reload()">🔄 اختيار امتحان آخر</button>
            <div class="review-section" id="reviewSection">
                <div class="review-title">📋 مراجعة الإجابات</div>
            </div>
        </div>
    </div>

    <script src="exams.js"></script>
    <script>
        function filterExams(level, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.exam-card').forEach(card => {
                card.style.display = (level === 'all' || card.dataset.level == level) ? '' : 'none';
            });
        }
    </script>
</body>

</html>
